    <!-- Endlech.lu · Wort-Bildmarke. Zeichen nachgezeichnet aus public/images/logo.png.

         Schriftzug: Inter Bold (SIL Open Font License 1.1), font-size 500,
         letter-spacing -13, in Pfade umgewandelt (BF-99).

         Die Pfade sind erzeugt, nicht gezeichnet: geshaped mit HarfBuzz - also mit
         dem Kerning der Schrift - und mit fontTools in SVG-Koordinaten gerechnet.
         Wer den Schriftzug aendert, erzeugt sie neu und prueft die Breite gegen die
         viewBox.

         Vorher stand hier ein <text>-Element mit dem Systemschrift-Stapel. Gemessen
         schwankte die Breite des Schriftzugs zwischen 2166 und 2778 Einheiten
         (28 %), je nachdem welche Schrift der Betrachter hatte - bei einer Wortmarke
         ist die Schrift die Marke. Der naheliegende Ausweg, die Datei in einem
         Vektorprogramm zu outlinen, haette die Schrift des jeweiligen Rechners
         eingefroren: auf einem Mac SF Pro, das fuer Markenzwecke nicht lizenziert
         ist. Deshalb eine ausdrueckliche, frei lizenzierte Schrift. -->
