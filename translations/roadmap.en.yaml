item:
    roadmap_changelog:
        title: "Public roadmap and changelog"
        reason: "This page itself. From the outside there was no way to tell whether the platform was still being worked on."
    reviews:
        title: "Reviews and comments"
        reason: "Guests should be able to share their own experience of a venue, not only read the recorded details."
    map:
        title: "Map view"
        reason: "Coordinates already exist for every venue. What is missing is the map that shows what is nearby."
    favourites:
        title: "Favourites"
        reason: "Save venues instead of searching for them again — the first use of an account beyond submitting."
    ios_app:
        title: "Native iOS app"
        reason: "The interface for it has existed since June. Whether a dedicated app is worth it depends on there being enough content people need while out."
    chat_widget:
        title: "Chat window"
        reason: "A direct line for questions no form covers. Who answers, and how quickly, has to be settled first."
    ai_filter:
        title: "AI-assisted search"
        reason: "A search that answers “wheelchair, quiet, open at lunchtime”. What exactly it should be able to do is not yet defined."
    android_and_logins:
        title: "Android app, Google and Apple sign-in"
        reason: "Noted because it was asked for. None of the three has been justified or prioritised so far."

shelved_item:
    passkey_conditional_ui:
        title: "Passkey suggestion in the sign-in field"
        reason: "Technically possible, but our own passkey button serves the same purpose without an extra source of failure."
    passkey_signup:
        title: "Creating an account with a passkey"
        reason: "An account needs a confirmed email address. Without one there would be no way back if the device is lost."
    passkey_api:
        title: "Passkeys in the app interface"
        reason: "The app signs in with a token. A second sign-in route would add no protection there."
    passkey_attestation:
        title: "Verifying where a passkey comes from"
        reason: "Requiring proof of the security key's manufacturer would shut out devices without anyone evaluating that information."
    apple_splash:
        title: "Launch screens for iPhone installation"
        reason: "A dozen image files per device size for a tenth of a second less white screen."
    pull_to_refresh:
        title: "Pull to refresh"
        reason: "The page reloads on every request. The gesture would rebuild what the browser already does."
    push_notifications:
        title: "Push notifications"
        reason: "Without a reason that justifies an interruption, a push notification is just a disturbance. Where there is something to report, there is an email."
    mobile_audit:
        title: "A one-off mobile review of every page"
        reason: "Instead of a one-off review, every new page is checked at 320 pixels. That lasts longer."
