person:
    section_title: "Gründer"
    role: "Gründer von Endlech.lu"
    bio: "Michael Ferreira hat Endlech.lu gegründet, weil er die Lücke selbst kennt: Er ist seit Geburt von einer Spinalen Muskelatrophie (SMA2) betroffen und auf einen Rollstuhl angewiesen. Als Programmierer und Fotograf baut er die Plattform, die er sich als Gast immer gewünscht hat."
    photo_credit: "Foto: Michael Ferreira (Selbstporträt), Endlech.lu"
