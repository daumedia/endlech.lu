boilerplate:
    section_title: "Über Endlech.lu"
    section_intro: "Drei freigegebene Beschreibungstexte. Sie dürfen wörtlich übernommen werden."
    short_label: "Kurz"
    medium_label: "Mittel"
    long_label: "Lang"
    word_hint: "rund %count% Wörter"
    short: "Endlech.lu ist die offene Plattform für barrierefreie Gastronomie in Luxemburg: Für jedes erfasste Lokal steht dort, was tatsächlich zugänglich ist. Kostenlos, werbefrei und öffentlich nachprüfbar."
    medium: "Endlech.lu ist die offene Plattform für barrierefreie Gastronomie in Luxemburg. Für jedes erfasste Lokal steht dort, was zugänglich ist und was nicht: stufenloser Eingang, barrierefreies WC, Türbreite und Tischabstand in Zentimetern, Assistenzhunde, Beleuchtung, Wickeltisch und Behindertenparkplatz. Die Angaben kommen aus der Community und werden vom Team vor Ort geprüft. Eintrag, Daten und Bewertung sind für jedes Restaurant im Land kostenlos und öffentlich."
    long: "Endlech.lu ist die offene Plattform für barrierefreie Gastronomie in Luxemburg. Wer auf einen Rollstuhl oder eine Begleitung angewiesen ist, kann heute nicht planen, ob ein Restaurantbesuch gelingt: Weder Kartendienste noch die Websites der Häuser beantworten die Fragen, auf die es ankommt. Endlech.lu beantwortet sie — stufenloser Eingang, barrierefreies WC, Türbreite und Tischabstand in Zentimetern, Assistenzhunde, Beleuchtung, Wickeltisch, Behindertenparkplatz. Die Angaben kommen aus der Community und werden vom Team vor Ort geprüft; was nicht gemessen wurde, zählt als nicht erfüllt. Eintrag, Daten und Bewertung sind kostenlos und bleiben es, für jedes Restaurant im Land. Der vollständige Datensatz steht unter CC BY 4.0 zum Herunterladen bereit, und die Plattform legt ihre Kennzahlen und ihre Finanzen öffentlich offen. Online seit März 2026."

