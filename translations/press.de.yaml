    release_note: "Diese Zitate sind freigegeben und dürfen ohne Rückfrage verwendet werden."
    q1: "Barrierefreiheit soll kein Zufall sein. Wer im Rollstuhl sitzt, will vor dem Losfahren wissen, ob es geht – nicht erst vor der Tür."
    q2: "Wären unsere Bewertungen käuflich, wären sie wertlos. Deshalb bleiben Eintrag, Daten und Punktzahl kostenlos – für jedes Restaurant, ob Partner oder nicht."

