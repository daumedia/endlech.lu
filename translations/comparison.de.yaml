# Vergleichsseiten (Feature 03).
#
# Eigene Domain statt eines Blocks in messages.*.yaml: Die vier messages-Kataloge
# tragen bereits über 1200 Schlüssel. Wichtiger noch — die Merkmalstabelle ruft
# ihre Schlüssel datengetrieben auf, und der Scanner in CatalogueCompletenessTest
# erfasst nur Literale. Deshalb prüft ComparisonCatalogueTest die in
# App\Comparison\ genannten Schlüssel zusätzlich gegen diese vier Dateien.
