partner:
    meta_title: "Partnerprogramm für Restaurants"
    hero:
        eyebrow: "Partnerprogramm"
        heading: "Ihr Gast steht vor der Tür — und dreht wieder um."
        text: "Eine Stufe am Eingang, eine Tür, die zu schmal ist, ein WC im Untergeschoss: Für viele Menschen in Luxemburg endet der Restaurantbesuch, bevor er beginnt. Wir helfen Ihnen, diese Hürden zu finden und zu beseitigen."
        cta: "Auf die Warteliste"
    benefits:
        title: "Was Sie als Partner bekommen"
        advisory_title: "Beratungsbericht"
        advisory_text: "Wir kommen zu Ihnen, sehen uns Ihr Haus mit den Augen Ihrer Gäste an und schreiben auf, was gut läuft und was sich lohnt. Konkret, nach Aufwand sortiert, ohne Fachchinesisch."
        box_title: "Inclusion-Box"
        box_text: "Materialien für den Alltag vor Ort: Hinweisschilder, Aufkleber für Eingang und Fenster, Tischaufsteller. Damit Ihre Gäste schon vor dem Betreten wissen, woran sie sind."
        visibility_title: "Sichtbarkeit"
        visibility_text: "Wir erzählen, was Sie verändert haben — in unseren Kanälen und auf Ihrem Profil. Nicht als Werbeplatz, sondern als Beispiel, das andere Häuser nachmachen können."
    integrity:
        badge: "Unser Versprechen"
        heading: "Bewertung gibt es nicht zu kaufen."
        text: "Wir sind eine Plattform für Barrierefreiheit. Wären unsere Bewertungen käuflich, wären sie wertlos — für Ihre Gäste und für Sie. Deshalb gilt ohne Ausnahme:"
        point_1: "Eintrag, Barrierefreiheits-Daten und Score sind und bleiben kostenlos und öffentlich — für jedes Restaurant in Luxemburg, ob Partner oder nicht."
        point_2: "Das Verifizierungs-Badge hängt allein an der geprüften Barrierefreiheit. Eine Mitgliedschaft ändert daran nichts."
        point_3: "Die Mitgliedschaft hat keinerlei Einfluss auf Ihre Bewertung, Ihre Platzierung in Suchergebnissen oder Ihre Sichtbarkeit in Filtern."
    included:
        title: "Was ist enthalten?"
        subtitle: "Alles, was mit der Bewertung zu tun hat, ist kostenlos. Bezahlt werden Beratung, Materialien und Begleitung."
        caption: "Vergleich der kostenlosen Leistungen mit denen der Partner-Mitgliedschaft"
        col_feature: "Leistung"
        col_free: "Kostenlos"
        col_partner: "Partner"
        row_listing: "Eintrag auf Endlech.lu"
        row_score: "Barrierefreiheits-Daten und Score"
        row_badge: "Verifizierungs-Badge"
        row_search: "Sichtbarkeit in Suche und Filtern"
        row_report: "Beratungsbericht vor Ort"
        row_box: "Inclusion-Box mit Materialien"
        row_guidance: "Begleitung bei der Umsetzung"
        row_funding: "Unterstützung beim Förderantrag"
        row_plaque: "Partner-Plakette (rein informativ)"
        # Gequotet, weil YAML `yes`/`no` sonst als Boolean liest (wie bei tristate).
        "yes": "enthalten"
        "no": "nicht enthalten"
        pricing_note: "Preise und Paketumfang stehen noch nicht fest. Wer auf der Warteliste steht, erfährt sie als Erstes — und entscheidet dann in Ruhe."
    legal:
        title: "Der rechtliche Rahmen"
        law: "Das luxemburgische Gesetz vom 7. Januar 2022 über die Zugänglichkeit von Orten, die dem Publikum offenstehen, gilt auch für bestehende Restaurants. Für sie läuft die Frist zur Anpassung bis zum 1. Januar 2032."
        aid: "Der Staat beteiligt sich: Für Arbeiten, Studien und Beratung werden 50 % der Kosten übernommen, gedeckelt auf 24 000 € HTVA. Wer früh anfängt, hat mehr Auswahl bei Handwerkern und mehr Zeit für die Anträge."
        link: "Informationen auf guichet.public.lu"
        link_new_window: "(öffnet in einem neuen Fenster)"
        disclaimer_label: "Hinweis:"
        disclaimer: "Dies ist eine allgemeine Information und keine Rechtsberatung. Für Ihren konkreten Fall wenden Sie sich bitte an die zuständigen Stellen oder an eine Rechtsberatung."
    how:
        title: "So läuft es ab"
        step1_title: "Auf die Warteliste"
        step1_text: "Sie tragen sich unten ein und bestätigen Ihre E-Mail-Adresse. Das verpflichtet zu nichts und kostet nichts."
        step2_title: "Besuch und Gespräch"
        step2_text: "Wir melden uns, kommen vorbei und sehen uns Ihr Haus an. Dieser erste Besuch ist kostenlos — auch wenn Sie danach Nein sagen."
        step3_title: "Sie entscheiden"
        step3_text: "Sie kennen dann den Aufwand, die Kosten und die Fördermöglichkeiten. Erst danach entscheiden Sie, ob eine Mitgliedschaft für Sie Sinn ergibt."
    faq:
        title: "Häufige Fragen"
        q1: "Verbessert eine Zahlung unseren Score?"
        a1: "Nein. Der Score ergibt sich ausschließlich aus den erfassten Barrierefreiheits-Merkmalen Ihres Hauses. Es gibt keinen Aufschlag, keine bevorzugte Platzierung und keine Möglichkeit, ihn zu kaufen. Wenn Sie als Partner besser abschneiden, dann weil Sie etwas verändert haben — nicht weil Sie gezahlt haben."
        q2: "Was ist, wenn wir schlecht abschneiden?"
        a2: "Dann ist das der Ausgangspunkt, nicht das Urteil. Fast jedes Haus hat Stellen, an denen es hakt. Der Bericht zeigt Ihnen, welche davon sich mit wenig Aufwand beheben lassen und welche größere Umbauten wären. Wir veröffentlichen keine Momentaufnahme, um jemanden vorzuführen."
        q3: "Ist die Verifizierung wirklich kostenlos?"
        a3: "Ja. Verifizierung, Eintrag und alle Barrierefreiheits-Daten sind kostenlos und bleiben es. Sie sind unser öffentlicher Auftrag und nicht Teil des Angebots. Ein Restaurant, das nie Partner wird, hat genau dieselben Möglichkeiten auf der Plattform."
        q4: "Was kostet die Mitgliedschaft?"
        a4: "Das steht noch nicht fest. Wir legen den Preis erst fest, wenn der Umfang der Leistungen final ist — alles andere wäre geraten. Wer auf der Warteliste steht, erfährt die Preise als Erstes und kann dann entscheiden."
        q5: "Wann geht es los?"
        a5: "Wir starten mit einer kleinen Gruppe von Häusern, damit wir jedem genug Zeit widmen können. Sobald wir die ersten Termine vergeben, melden wir uns bei Ihnen — in der Reihenfolge der Anmeldungen."
        q6: "Wer kommt zum Besuch?"
        a6: "Jemand aus unserem Team, gemeinsam mit Menschen, die selbst auf Barrierefreiheit angewiesen sind. Genau darin liegt der Unterschied zu einer reinen Checkliste: Sie erfahren nicht nur, ob eine Norm eingehalten ist, sondern wie sich Ihr Haus tatsächlich benutzen lässt."
    form:
        title: "Auf die Warteliste"
        subtitle: "Unverbindlich und kostenlos. Wir melden uns, sobald es losgeht."
