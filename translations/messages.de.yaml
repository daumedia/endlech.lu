about:
    title: "Über Endlech | Endlech.lu"
    heading: "Über Endlech"
    subtitle: "Die Geschichte hinter Endlech.lu — einer Plattform, die lange überfällig war."
    founder: "Gründer"
    founder_bio: "Ich bin Michael, 30 Jahre alt und seit Geburt mit SMA2 (Spinale Muskelatrophie Typ 2) beeinträchtigt. Als leidenschaftlicher Programmierer und Fotograf weiß ich aus eigener Erfahrung, wie wichtig echte Barrierefreiheit im Alltag ist — und genau das treibt mich bei Endlech.lu an."
    tag_age: "30 Jahre"
    tag_sma: "SMA2"
    tag_programmer: "Programmierer"
    tag_photographer: "Fotograf"
    story_title: "Die Geschichte von Endlech.lu"
    story_intro: "Endlech.lu war eigentlich schon seit Jahren überfällig. Die Idee hatte ich schon als Jugendlicher — ein Ort, an dem Menschen mit eingeschränkter Mobilität unkompliziert barrierefreie Restaurants in Luxemburg finden können. Etwas, das es so einfach und übersichtlich schlicht noch nicht gab."
    timeline_2018_title: "Planung beginnt"
    timeline_2018_text: "Die Idee reifte zur konkreten Entscheidung: Ich wollte die Plattform wirklich bauen. 2018 begann ich, das Projekt ernsthaft zu planen."
    timeline_2020_title: "Aktive Entwicklung"
    timeline_2020_text: "Gemeinsam mit einem Freund und Partner begann ich, die Plattform aktiv umzusetzen. Wir teilten die Vision und arbeiteten mit echtem Elan daran."
    timeline_2022_title: "Unfreiwillige Pause"
    timeline_2022_text: "Leider klappte es mit dem Partner nicht, und alleine fehlte mir schlicht die Zeit. Das Projekt musste ich schweren Herzens auf Eis legen."
    timeline_2025_title: "Neustart"
    timeline_2025_text: "Ende 2025 habe ich beschlossen, wieder anzufangen — und es diesmal durchzuziehen. Mit neuer Energie und dem richtigen Tech-Stack habe ich die Entwicklung komplett neu gestartet."
    timeline_2026_date: "März 2026"
    timeline_2026_title: "Erste Live-Version"
    timeline_2026_text: "Im März 2026 geht Endlech.lu endlich online — mit echten Restaurantdaten, Barrierefreiheits-Filtern, Community-Vorschlägen und einem vollständigen Admin-Panel. Der Anfang ist gemacht, und die Plattform wächst mit jeder Bewertung."
    mission_title: "Unsere Mission"
    mission_text: "Barrierefreiheit soll kein Zufall sein. Mit Endlech.lu wollen wir Menschen mit eingeschränkter Mobilität helfen, Restaurants in Luxemburg zu finden, die wirklich zugänglich sind — geprüft von der Community, für die Community."
    mission_cta: "Restaurants entdecken"

legal:
    title: "Impressum – Endlech.lu"
    heading: "Impressum"
    info_title: "Angaben gemäß § 5 TMG / Art. 11 Loi sur le commerce électronique"
    info_text: "Endlech.lu\nLuxemburg"
    contact_title: "Kontakt"
    contact_email_label: "E-Mail:"
    disclaimer_title: "Haftungsausschluss"
    content_title: "Haftung für Inhalte"
    content_text: "Die Inhalte unserer Seiten wurden mit größter Sorgfalt erstellt. Für die Richtigkeit, Vollständigkeit und Aktualität der Inhalte können wir jedoch keine Gewähr übernehmen."
    links_title: "Haftung für Links"
    links_text: "Unser Angebot enthält Links zu externen Webseiten Dritter, auf deren Inhalte wir keinen Einfluss haben. Deshalb können wir für diese fremden Inhalte auch keine Gewähr übernehmen. Für die Inhalte der verlinkten Seiten ist stets der jeweilige Anbieter oder Betreiber der Seiten verantwortlich."
    privacy_title: "Datenschutz"
    privacy_text: "Die Restaurantliste, die Detailseiten und der offene Datensatz lassen sich ohne Konto und ohne Angabe personenbezogener Daten nutzen. Wer ein Konto anlegt, ein Restaurant vorschlägt oder sich auf eine Warteliste setzt, gibt dabei bewusst Daten an — welche das sind und wohin sie gehen, steht in den folgenden Abschnitten."
    error_tracking_title: "Fehleranalyse (Sentry)"
    error_tracking_text: "Zur Erkennung und Behebung technischer Fehler nutzen wir Sentry (Functional Software, Inc.). Tritt auf unserer Webseite ein Fehler auf, werden technische Angaben wie Zeitpunkt, aufgerufene Seite und Fehlermeldung an Server in der Europäischen Union (Frankfurt am Main) übermittelt. IP-Adressen und Nutzerdaten werden dabei nicht übertragen. Rechtsgrundlage ist unser berechtigtes Interesse an einem stabilen und sicheren Betrieb der Webseite gemäß Art. 6 Abs. 1 lit. f DSGVO."
    mail_title: "E-Mail-Versand (Brevo)"
    mail_text: "Für den Versand von E-Mails — Bestätigungen, Benachrichtigungen, Wartelisten — nutzen wir Brevo (Sendinblue GmbH, Köln). Übermittelt werden die E-Mail-Adresse und der Name des Empfängers sowie der Inhalt der jeweiligen Nachricht. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO (Durchführung vorvertraglicher Maßnahmen) beziehungsweise lit. a bei Wartelisten-Anmeldungen. Ein Auftragsverarbeitungsvertrag liegt vor."
    marketing_title: "Newsletter und Kampagnen (Brevo)"
    marketing_text: "Wer beim Eintragen in eine Warteliste oder bei der Registrierung ausdrücklich zustimmt, wird als Kontakt bei Brevo (Brevo SA, Frankreich) gespeichert — dauerhaft und zu Werbezwecken, also über den reinen Versand einer einzelnen Nachricht hinaus. Übermittelt werden: E-Mail-Adresse, Name des Ansprechpartners, Organisations- beziehungsweise Restaurantname, Sprache, die Rolle im Vertrieb und der Bearbeitungsstand. Freitextnachrichten, Telefonnummern und Ortsangaben werden ausdrücklich nicht übermittelt. Rechtsgrundlage ist Art. 6 Abs. 1 lit. a DSGVO (Einwilligung). Die Zustimmung ist freiwillig, keine Bedingung für die Anmeldung und jederzeit widerrufbar — über den Abmeldelink in jeder Kampagne oder durch Löschung des Kontos. Nach einem Widerruf wird der Kontakt bei Brevo entfernt."
    transit_title: "Haltestellen in der Nähe (Verkéiersverbond)"
    transit_text: "Auf den Restaurant-Detailseiten zeigen wir Haltestellen des öffentlichen Nahverkehrs. Dafür fragen wir die Schnittstelle des Verkéiersverbond an — übermittelt werden ausschließlich die Koordinaten des Restaurants. Keine Daten der Besucherinnen und Besucher: weder IP-Adresse noch Kennung. Die Antwort speichern wir 24 Stunden zwischen."
    rights_title: "Deine Rechte"
    rights_intro: "Du hast jederzeit das Recht auf:"
    rights_access: "Auskunft über die zu dir gespeicherten Daten (Art. 15 DSGVO)"
    rights_erasure: "Löschung deines Kontos und der damit verbundenen Daten (Art. 17 DSGVO)"
    rights_portability: "Übertragbarkeit — eine maschinenlesbare Kopie deiner Daten (Art. 20 DSGVO)"
    rights_withdraw: "Widerruf deiner Einwilligung, etwa zu einer Wartelisten-Anmeldung (Art. 7 Abs. 3 DSGVO)"
    rights_complaint: "Beschwerde bei der Commission nationale pour la protection des données (CNPD), Luxemburg"
    rights_how: "Auskunft, Export und Löschung erledigst du selbst in deinem Profil — sofort und ohne Anfrage:"
    rights_profile_link: "zu meinem Profil"
    retention_title: "Speicherdauer"
    retention_text: "Kontodaten speichern wir, solange das Konto besteht; nach der Löschung verschwinden sie unmittelbar. Wartelisten-Anmeldungen bleiben, bis sie zurückgezogen werden oder das Programm startet. Restaurant-Angaben bleiben dauerhaft — sie sind Sachangaben und werden nach einer Kontolöschung von der Person getrennt."

criteria:
    score_title: "Wie die Punktzahl entsteht"
    score_intro: "Auf der Transparenzseite und im offenen Datensatz steht je Restaurant eine Punktzahl von 0 bis 10. Sie ergibt sich aus acht gleichgewichteten Merkmalen:"
    score_wheelchair: "Stufenloser Zugang"
    score_toilet: "Barrierefreie Toilette"
    score_dogs: "Assistenzhunde willkommen"
    score_lighting: "Gute Beleuchtung"
    score_changing_table: "Wickeltisch"
    score_parking: "Behindertenparkplatz"
    score_door_width: "Türbreite mindestens 90 cm (DIN 18040)"
    score_table_spacing: "Tischabstand mindestens 90 cm (DIN 18040)"
    score_unmeasured: "Wichtig: Was wir nicht erfasst haben, zählt wie nicht erfüllt. Die Zahl misst also dokumentierte Barrierefreiheit — nicht die tatsächliche. Ein Restaurant, über das wir nichts wissen, bekommt 0 von 10, auch wenn vor Ort alles stimmt."
    score_where: "Die aktuellen Zahlen stehen auf der Transparenzseite:"
    score_open_link: "zu /open"
    title: "Kriterien für Barrierefreiheit – Endlech.lu"
    heading: "Kriterien für Barrierefreiheit"
    intro: "Diese Kriterien helfen uns, Restaurants objektiv auf ihre Barrierefreiheit zu bewerten. Jedes Restaurant wird anhand der folgenden Punkte eingeschätzt."
    entrance_title: "Barrierefreier Eingang"
    entrance_text: "Der Eingang ist ohne Stufen oder Schwellen zugänglich, oder eine Rampe ist vorhanden. Automatische oder leicht zu öffnende Türen sind ein Plus."
    parking_title: "Behindertenparkplatz"
    parking_text: "Ein ausgewiesener Parkplatz für Personen mit Behinderung in unmittelbarer Nähe des Eingangs ist vorhanden."
    toilet_title: "Barrierefreie Toilette"
    toilet_text: "Eine rollstuhlgerechte Toilette mit ausreichend Bewegungsfreiheit, Haltegriffen und erreichbarem Waschbecken ist vorhanden."
    interior_title: "Rollstuhlgerechtes Inneres"
    interior_text: "Ausreichend breite Gänge (mindestens 90 cm), unterfahrbare Tische und genügend Bewegungsraum zwischen den Sitzplätzen ermöglichen eine selbstständige Navigation."
    staff_title: "Hilfsbereites Personal"
    staff_text: "Das Personal ist sensibilisiert und bereit, Menschen mit Einschränkungen aktiv zu unterstützen – ohne aufdringlich zu sein."
    menu_title: "Gut lesbare Speisekarte"
    menu_text: "Die Speisekarte ist in gut lesbarer Schriftgröße gedruckt oder digital verfügbar. Braille- oder Großdruck-Versionen sind ein weiteres Plus."
    note_label: "Hinweis:"
    note_text: "Die Bewertungen auf Endlech.lu basieren auf Erfahrungen unserer Community. Barrierefreiheit kann sich je nach individuellem Bedarf unterscheiden. Wir empfehlen, vor dem Besuch direkt beim Restaurant nachzufragen."

