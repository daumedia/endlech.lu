organisation:
    meta_title: "Für Gemeinden, Unternehmen und Organisationen"
    breadcrumb: "Sie sind hier"
    breadcrumb_root: "Organisationen"
    hero:
        eyebrow: "Gemeinsam"
        heading: "Barrierefreiheit wird sichtbar, wenn viele mitziehen."
        text: "Ein einzelnes Restaurant kann seine Stufe abbauen. Damit daraus ein Bild für ganz Luxemburg wird, braucht es Gemeinden, die ihre Gastronomie erfassen lassen, Unternehmen, die mitfinanzieren, und Organisationen, die mitentscheiden, was überhaupt gemessen wird."
    selector:
        title: "Worum geht es bei Ihnen?"
        subtitle: "Drei Wege, drei sehr unterschiedliche Rollen."
        more: "Mehr erfahren"
        commune: "Sie wollen wissen, wie barrierefrei die Gastronomie in Ihrer Gemeinde tatsächlich ist."
        company: "Sie wollen Barrierefreiheit finanziell oder mit Ihrem Team unterstützen."
        association: "Sie vertreten Menschen mit Behinderung und wollen mitbestimmen, was gemessen wird."
    type:
        commune: "Gemeinde"
        company: "Unternehmen"
        association: 'Verein'
    timeframe:
        asap: "So bald wie möglich"
        this_year: "Noch dieses Jahr"
        next_budget_year: "Im nächsten Haushaltsjahr"
        unclear: "Noch offen"
    sponsorship:
        inclusion_boxes: "Inclusion-Boxen finanzieren"
        employee_engagement: "Mitarbeitende als Testpersonen"
        commune_sponsorship: "Eine Gemeinde mitfinanzieren"
        translation: "Übersetzungen finanzieren"
        workshops: "Workshops finanzieren"
        other: "Etwas anderes"
    collaboration:
        advisory_board: "Sitz im Beirat"
        data_access: "Zugang zu aggregierten Daten"
        joint_communication: "Gemeinsame Kommunikation"
        referrals: "Weiterempfehlung an unsere Zielgruppe"
        other: "Etwas anderes"
    commune:
        title: "Für Gemeinden"
        intro: "Wir erfassen die Gastronomie in Ihrer Gemeinde vor Ort – Lokal für Lokal, nach denselben Kriterien wie überall auf Endlech.lu. Am Ende wissen Sie, wo Ihre Gemeinde steht, und Ihre Einwohner sehen es auch."
        scope_title: "Was die Erhebung umfasst"
        scope_1: "Besuch jedes teilnehmenden Lokals vor Ort, gemeinsam mit Menschen, die selbst auf Barrierefreiheit angewiesen sind."
        scope_2: "Erfassung nach den öffentlichen Kriterien: Eingang, WC, Beleuchtung, Assistenzhunde, Wickeltisch, Behindertenparkplatz."
        scope_3: "Fotos und Maße, wo sie für die Einschätzung nötig sind."
        scope_4: "Hinweise, welche Hürden sich mit geringem Aufwand beheben lassen und welche baulich sind."
        deliverables_title: "Was Sie bekommen"
        deliverable_1_title: "Öffentliche Karte"
        deliverable_1_text: "Alle erfassten Lokale Ihrer Gemeinde auf Endlech.lu – frei zugänglich für alle."
        deliverable_2_title: "Schriftlicher Bericht"
        deliverable_2_text: "Aufbereitet für den Gemeinderat: Ausgangslage, Auffälligkeiten, Handlungsempfehlungen."
        deliverable_3_title: "Präsentation"
        deliverable_3_text: "Wir stellen die Ergebnisse im Gemeinderat oder in einer Kommission persönlich vor."
        duration_title: "Wie lange es dauert"
        duration_text: "Von der Beauftragung bis zum Bericht vergehen je nach Zahl der Lokale acht bis sechzehn Wochen. Die Besuche selbst legen wir in Absprache auf einige zusammenhängende Wochen, damit die Ergebnisse vergleichbar bleiben."
        no_guarantee_title: "Sie bezahlen die Erhebung, nicht das Ergebnis."
        no_guarantee_text: "Das ist keine Formalie, sondern der Kern der Sache: Wir sagen nicht zu, dass Ihre Gemeinde gut abschneidet. Die Werte sind, was sie sind, und sie werden veröffentlicht – auch wenn sie unbequem ausfallen. Ein Ergebnis, das man kaufen könnte, wäre für Ihre Einwohner wertlos."
        law_title: "Der rechtliche Hintergrund"
        law_text: "Das Gesetz vom 7. Januar 2022 über die Zugänglichkeit öffentlich zugänglicher Orte gilt auch für bestehende Restaurants; für sie läuft die Frist bis zum 1. Januar 2032. Eine Erhebung zeigt Ihnen früh, wie viele Betriebe in Ihrer Gemeinde betroffen sind."
        law_disclaimer: "Allgemeine Information, keine Rechtsberatung."
        pricing: "Der Preis richtet sich nach der Zahl der Lokale und wird individuell kalkuliert. Schreiben Sie uns, wie viele Betriebe Sie ungefähr haben – Sie bekommen ein konkretes Angebot."
        cta: "Erhebung anfragen"
    company:
        title: "Für Unternehmen"
        intro: "Sie können Barrierefreiheit in Luxemburg mitfinanzieren, ohne dafür etwas zu bekommen, das andere nicht bekommen. Was Sie erhalten, ist die Nennung als Unterstützer – keine bessere Bewertung, keine bevorzugte Platzierung, keinen Einfluss auf Inhalte."
        formats_title: "Formate"
        format_1_title: "Inclusion-Boxen finanzieren"
        format_1_text: "Materialien für Restaurants: Hinweisschilder, Aufkleber, Tischaufsteller. Eine Box deckt ein Lokal ab."
        format_2_title: "Mitarbeitende als Testpersonen"
        format_2_text: "Ihr Team begleitet Erhebungen vor Ort. Das bringt uns Hände und Ihren Leuten eine Perspektive, die im Büro schwer zu vermitteln ist."
        format_3_title: "Eine Gemeinde mitfinanzieren"
        format_3_text: "Nicht jede Gemeinde hat Budget. Sie können die Erhebung für eine bestimmte Gemeinde übernehmen."
        format_4_title: "Übersetzungen und Workshops"
        format_4_text: "Die Plattform gibt es auf Luxemburgisch, Deutsch, Französisch und Englisch. Übersetzungen und Schulungen für Gastronomen kosten Geld, das nicht aus Mitgliedsbeiträgen kommt."
        exclusion_title: "Wen wir nicht als Sponsor annehmen"
        exclusion_text: "Damit unsere Empfehlungen etwas wert bleiben, nehmen wir kein Geld von Unternehmen, die von genau diesen Empfehlungen profitieren könnten:"
        exclusion_1: "Gastronomieketten und Betriebe, die selbst auf Endlech.lu bewertet werden."
        exclusion_2: "Firmen, die Umbauten für Barrierefreiheit ausführen."
        exclusion_3: "Hersteller und Lieferanten von Produkten, die wir in Beratungsberichten nennen könnten."
        exclusion_reason: "Diese Regel steht hier öffentlich, damit man uns daran messen kann. Im Zweifel sagen wir ab."
        cta: "Sponsoring anfragen"
    association:
        title: "Für Organisationen und Vereine"
        intro: "Wir messen Barrierefreiheit – aber wer legt fest, was gemessen wird und wie schwer es wiegt? Diese Entscheidung wollen wir nicht allein treffen. Dafür gibt es den Beirat."
        decides_title: "Worüber der Beirat entscheidet"
        decides_1: "Welche Kriterien erhoben werden und wie sie definiert sind."
        decides_2: "Wie stark die einzelnen Kriterien in den Score einfließen."
        decides_3: "Wann eine Bewertungsmethodik geändert wird – und wie das öffentlich dokumentiert wird."
        meetings_title: "Wie oft"
        meetings_text: "Zwei feste Sitzungen im Jahr, dazu eine schriftliche Runde, wenn zwischendurch etwas ansteht. Die Teilnahme ist auch remote möglich."
        public_title: "Öffentlich benannt"
        public_text: "Die Mitglieder des Beirats stehen mit Organisation und Namen auf der Seite. Wer über Kriterien mitentscheidet, soll nachvollziehbar sein."
        no_money_title: "Hier fließt in keine Richtung Geld."
        no_money_text: "Der Beirat ist kein Sponsoring und kein Kunde. Sie zahlen nichts, und Sie bekommen kein Honorar. Genau das macht die Mitarbeit glaubwürdig: Wer die Kriterien mitbestimmt, darf davon nicht wirtschaftlich abhängen."
        cta: "Interesse am Beirat anmelden"
    integrity:
        badge: "Für alle drei gleich"
        heading: "Bewertungen sind nicht käuflich."
        text: "Ob Gemeinde, Sponsor oder Beiratsmitglied: Niemand kann die Bewertung eines Restaurants beeinflussen. Das gilt ohne Ausnahme und ohne Ermessensspielraum."
        point_1: "Barrierefreiheits-Daten, Scores und Rankings sind kostenlos, öffentlich und für alle Restaurants gleich – unabhängig davon, ob jemand für die Erhebung bezahlt hat."
        point_2: "Eine Gemeinde, die eine Erhebung beauftragt, bekommt die Zahlen, die herauskommen. Kein Betrieb wird bessergestellt, weil die Gemeinde zahlt."
        point_3: "Sponsoren und Beiratsmitglieder haben keinen Zugriff auf einzelne Bewertungen und können keine Änderung an einem Eintrag veranlassen."
    form:
        title: "Anfrage senden"
        subtitle: "Unverbindlich. Wir melden uns und klären den Rest im Gespräch."
        type: "Um wen geht es?"
        type_changed: "Formular auf %type% umgestellt. Die Felder darunter haben sich geändert."
        organisation_name: "Name der Organisation"
