        duration_text: "Vun der Optragsvergab bis zum Bericht vergi je no Zuel vun de Lokaler aacht bis siechzéng Wochen. D'Besuche selwer leeë mir an Ofsprooch op e puer zesummenhänkend Wochen, fir datt d'Resultater vergläichbar bleiwen."
        no_guarantee_title: "Dir bezuelt d'Erhiewung, net d'Resultat."
        no_guarantee_text: "Dat ass keng Formalitéit, mee de Kär vun der Saach: Mir soen net zou, datt Är Gemeng gutt ofschneit. D'Wäerter sinn, wat se sinn, a si gi publizéiert — och wa se ongemittlech ausfalen. E Resultat, dat ee kéive kéint, wier fir Är Awunner näischt wäert."
        law_title: "De rechtlechen Hannergrond"
        law_text: "D'Gesetz vum 7. Januar 2022 iwwer d'Zougänglechkeet vun ëffentlech zougängleche Plaze gëllt och fir bestehend Restauranten; fir si leeft d'Frist bis den 1. Januar 2032. Eng Erhiewung weist Iech fréi, wéi vill Betriber an Ärer Gemeng betraff sinn."
        law_disclaimer: "Allgemeng Informatioun, keng Rechtsberodung."
        pricing: "De Präis riicht sech no der Zuel vun de Lokaler a gëtt individuell berechent. Schreift eis, wéi vill Betriber Dir ongeféier hutt — Dir kritt en konkreten Devis."
        cta: "Erhiewung ufroen"
    company:
        title: "Fir Betriber"
        intro: "Dir kënnt Barrièrefräiheet zu Lëtzebuerg matfinanzéieren, ouni datt Dir eppes kritt, wat anerer net kréien. Wat Dir kritt, ass d'Nennung als Ënnerstëtzer — keng besser Bewäertung, keng bevirzuegt Plazéierung, keen Afloss op Inhalter."
        formats_title: "Formater"
        format_1_title: "Inclusion-Boxe finanzéieren"
        format_1_text: "Material fir Restauranten: Hiweisschëlder, Opklieber, Dëschopsteller. Eng Box deckt e Lokal of."
        format_2_title: "Mataarbechter als Testpersounen"
        format_2_text: "Äert Team begleet Erhiewunge virun Ort. Dat bréngt eis Hänn an Äre Leit eng Perspektiv, déi um Büro schwéier ze vermëttelen ass."
        format_3_title: "Eng Gemeng matfinanzéieren"
        format_3_text: "Net all Gemeng huet Budget. Dir kënnt d'Erhiewung fir eng bestëmmte Gemeng iwwerhuelen."
        format_4_title: "Iwwersetzungen a Workshoppen"
        format_4_text: "D'Plattform gëtt et op Lëtzebuergesch, Däitsch, Franséisch an Englesch. Iwwersetzungen a Formatioune fir Gastronome kaschte Geld, dat net aus Memberskotisatioune kënnt."
        exclusion_title: "Wie mir net als Sponsor unhuelen"
        exclusion_text: "Fir datt eis Empfeelungen eppes wäert bleiwen, huele mir kee Geld vu Betriber, déi genee vun dësen Empfeelunge profitéiere kéinten:"
        exclusion_1: "Gastronomieketten a Betriber, déi selwer op Endlech.lu bewäert ginn."
        exclusion_2: "Firmen, déi Ëmbaute fir Barrièrefräiheet ausféieren."
        exclusion_3: "Hiersteller a Liwweranten vu Produkter, déi mir a Berodungsberichter nenne kéinten."
        exclusion_reason: "Dës Reegel steet hei ëffentlech, fir datt een eis dorun moosse kann. Am Zweiwel soe mir of."
        cta: "Sponsoring ufroen"
    association:
        title: "Fir Organisatiounen a Veräiner"
        intro: "Mir moossen Barrièrefräiheet — mee wie leet fest, wat gemooss gëtt a wéi schwéier et weit? Dës Entscheedung wëlle mir net eleng huelen. Dofir gëtt et de Beirot."
        decides_title: "Iwwer wat de Beirot decidéiert"
        decides_1: "Wéi eng Critèren erhuewe ginn a wéi se definéiert sinn."
        decides_2: "Wéi staark déi eenzel Critèren an de Score afléissen."
        decides_3: "Wéini eng Bewäertungsmethodik geännert gëtt — a wéi dat ëffentlech dokumentéiert gëtt."
        meetings_title: "Wéi dacks"
        meetings_text: "Zwou fest Sëtzungen am Joer, dozou eng schrëftlech Ronn, wann tëschenduerch eppes usteet. D'Deelname ass och op Distanz méiglech."
        public_title: "Ëffentlech genannt"
        public_text: "D'Membere vum Beirot stinn mat Organisatioun an Numm op der Säit. Wien iwwer Critère matdecidéiert, soll nozevollzéie sinn."
        no_money_title: "Hei fléisst a keng Richtung Geld."
        no_money_text: "De Beirot ass kee Sponsoring a kee Client. Dir bezuelt näischt, an Dir kritt keen Honorar. Genee dat mécht d'Matschaffe glafwierdeg: Wien d'Critèren matbestëmmt, dierf dovun net wirtschaftlech ofhänken."
        cta: "Interessi um Beirot umellen"
    integrity:
        badge: "Fir all dräi d'selwecht"
        heading: "Bewäertunge gi net verkaaft."
        text: "Ob Gemeng, Sponsor oder Beiratsmember: Kee kann d'Bewäertung vun engem Restaurant beaflossen. Dat gëllt ouni Ausnam an ouni Spillraum."
        point_1: "Barrièrefräiheets-Donnéeën, Scoren a Ranglëschte si gratis, ëffentlech a fir all Restaurant d'selwecht — onofhängeg dovun, ob een fir d'Erhiewung bezuelt huet."
        point_2: "Eng Gemeng, déi eng Erhiewung a Optrag gëtt, kritt d'Zuelen, déi erauskommen. Kee Betrib gëtt besser gestallt, well d'Gemeng bezuelt."
        point_3: "Sponsoren a Beiratsmemberen hu kee Zougrëff op eenzel Bewäertungen a kënne keng Ännerung un engem Andrag verlaangen."
