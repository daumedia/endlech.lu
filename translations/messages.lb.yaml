partner:
    meta_title: "Partnerprogramm fir Restauranten"
    hero:
        eyebrow: "Partnerprogramm"
        heading: "Äre Gaascht steet virun der Dier — an dréint erëm ëm."
        text: "Eng Trap um Agank, eng Dier déi ze schmuel ass, eng Toilette am Ënnerdaach: Fir vill Leit zu Lëtzebuerg ass de Restaurantbesuch eriwwer, ier en ugefaangen huet. Mir hëllefen Iech, dës Hürden ze fannen an ewechzekréien."
        cta: "Op d'Waardelëscht"
    benefits:
        title: "Wat Dir als Partner kritt"
        advisory_title: "Berodungsbericht"
        advisory_text: "Mir kommen bei Iech, kucken Ären Haus mat den Ae vun Äre Gäscht a schreiwen op, wat gutt leeft a wat sech lount. Konkret, no Opwand geuerdnet, ouni Fachchinesesch."
        box_title: "Inclusion-Box"
        box_text: "Material fir den Alldag virun Ort: Hiweisschëlder, Opklieber fir Agank a Fënster, Dëschopsteller. Domat Är Gäscht scho virum Erakomme wëssen, wou se drun sinn."
        visibility_title: "Sichtbarkeet"
        visibility_text: "Mir erzielen, wat Dir geännert hutt — op eise Kanäl an op Ärem Profil. Net als Reklammplaz, mee als Beispill, dat aner Haiser nomaache kënnen."
    integrity:
        badge: "Eise Verspriechen"
        heading: "Bewäertunge gi net verkaaft."
        text: "Mir sinn eng Plattform fir Barrièrefräiheet. Wa eis Bewäertunge kéinte kaaft ginn, wären se näischt wäert — fir Är Gäscht a fir Iech. Dofir gëllt ouni Ausnam:"
        point_1: "Andrag, Barrièrefräiheets-Donnéeën a Score si gratis an ëffentlech a bleiwen et — fir all Restaurant zu Lëtzebuerg, Partner oder net."
        point_2: "De Verifikatiouns-Badge hänkt eleng un der gepréifter Barrièrefräiheet. Eng Memberschaft ännert doduerch näischt."
        point_3: "D'Memberschaft huet keen Afloss op Är Bewäertung, Är Plaz an de Sichresultater oder Är Sichtbarkeet an de Filteren."
    included:
        title: "Wat ass abegraff?"
        subtitle: "Alles wat mat der Bewäertung ze dinn huet, ass gratis. Bezuelt gi Berodung, Material a Begleedung."
        caption: "Verglach vun de gratis Leeschtunge mat deene vun der Partner-Memberschaft"
        col_feature: "Leeschtung"
        col_free: "Gratis"
        col_partner: "Partner"
        row_listing: "Andrag op Endlech.lu"
        row_score: "Barrièrefräiheets-Donnéeën a Score"
        row_badge: "Verifikatiouns-Badge"
        row_search: "Sichtbarkeet an der Sich an de Filteren"
        row_report: "Berodungsbericht virun Ort"
        row_box: "Inclusion-Box mat Material"
        row_guidance: "Begleedung bei der Ëmsetzung"
        row_funding: "Ënnerstëtzung beim Subsidenantrag"
        row_plaque: "Partner-Plackett (reng informativ)"
        # Gequotet, weil YAML `yes`/`no` sonst als Boolean liest (wie bei tristate).
        "yes": "abegraff"
        "no": "net abegraff"
        pricing_note: "Präisser an Ëmfank vun de Formule stinn nach net fest. Wien op der Waardelëscht steet, erfiert se als Éischt — a decidéiert dann a Rou."
    legal:
        title: "De rechtleche Kader"
        law: "D'Lëtzebuerger Gesetz vum 7. Januar 2022 iwwer d'Zougänglechkeet vun ëffentlech zougängleche Plazen gëllt och fir bestehend Restauranten. Fir si leeft d'Frist bis den 1. Januar 2032."
        aid: "De Staat bedeelegt sech: Fir Aarbechten, Studien a Berodung ginn 50 % vun de Käschten iwwerholl, gedeckelt op 24 000 € HTVA. Wien fréi ufänkt, huet méi Auswiel bei den Handwierker a méi Zäit fir d'Demarchen."
        link: "Informatiounen op guichet.public.lu"
        link_new_window: "(mécht an engem neie Fënster op)"
        disclaimer_label: "Hiweis:"
        disclaimer: "Dat hei ass eng allgemeng Informatioun a keng Rechtsberodung. Fir Äre konkrete Fall wenddech Iech w.e.g. un déi zoustänneg Servicer oder un eng Rechtsberodung."
    how:
        title: "Wéi et leeft"
        step1_title: "Op d'Waardelëscht"
        step1_text: "Dir dréit Iech hei ënnen an a bestätegt Är E-Mail-Adress. Dat verflicht zu näischt a kascht näischt."
        step2_title: "Besuch a Gespréich"
        step2_text: "Mir mellen eis, kommen laanscht a kucken Ären Haus un. Dëse éischte Besuch ass gratis — och wann Dir duerno Nee sot."
        step3_title: "Dir decidéiert"
        step3_text: "Dir kennt dann den Opwand, d'Käschten an d'Subsidesméiglechkeeten. Eréischt duerno decidéiert Dir, ob eng Memberschaft fir Iech Sënn mécht."
    faq:
        title: "Dacks gestallte Froen"
        q1: "Verbessert eng Bezuelung eise Score?"
        a1: "Nee. De Score ergëtt sech eleng aus de erfaassten Barrièrefräiheets-Charakteristike vun Ärem Haus. Et gëtt kee Bonus, keng bevirzuegt Plazéierung a keng Méiglechkeet, en ze kafen. Wann Dir als Partner besser ofschneit, dann well Dir eppes geännert hutt — net well Dir bezuelt hutt."
        q2: "Wat ass, wa mir schlecht ofschneiden?"
        a2: "Dann ass dat den Ausgangspunkt, net d'Urteel. Bal all Haus huet Plazen, wou et hänkt. De Bericht weist Iech, wéi eng dovun sech mat wéineg Opwand behiewe loossen a wéi eng méi grouss Ëmbauten wären. Mir publizéiere kee Momentopnam, fir iergendeen virzeféieren."
        q3: "Ass d'Verifikatioun wierklech gratis?"
        a3: "Jo. Verifikatioun, Andrag an all Barrièrefräiheets-Donnéeë si gratis a bleiwen et. Si sinn eisen ëffentlechen Optrag a kee Bestanddeel vum Ugebot. E Restaurant, deen ni Partner gëtt, huet genee déiselwecht Méiglechkeeten op der Plattform."
        q4: "Wat kascht d'Memberschaft?"
        a4: "Dat steet nach net fest. Mir leeë de Präis eréischt fest, wann den Ëmfang vun de Leeschtunge final ass — alles anescht wier gerode. Wien op der Waardelëscht steet, erfiert d'Präisser als Éischt a kann dann decidéieren."
        q5: "Wéini geet et lass?"
        a5: "Mir starten mat enger klenger Grupp vun Haiser, fir datt mir jidderengem genuch Zäit widmen kënnen. Sobal mir déi éischt Terminen ausginn, mellen mir eis bei Iech — an der Reiefolleg vun den Umeldungen."
        q6: "Wien kënnt op Besuch?"
        a6: "Een aus eisem Team, zesumme mat Leit, déi selwer op Barrièrefräiheet ugewise sinn. Genee doran läit den Ënnerscheed zu enger reiner Checklëscht: Dir erfaart net nëmmen, ob eng Norm agehale gëtt, mee wéi Ären Haus sech tatsächlech benotze léisst."
    form:
        title: "Op d'Waardelëscht"
        subtitle: "Onverbindlech a gratis. Mir mellen eis, sobal et lassgeet."
