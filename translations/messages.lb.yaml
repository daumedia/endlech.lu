about:
    title: "Iwwer Endlech | Endlech.lu"
    heading: "Iwwer Endlech"
    subtitle: "D'Geschicht hannert Endlech.lu — enger Plattform, déi scho laang iwwerfälleg war."
    founder: "Grënner"
    founder_bio: "Ech sinn de Michael, 30 Joer al a säit der Gebuert mat SMA2 (Spinale Muskelatrophie Typ 2) betraff. Als passionéierte Programméierer a Fotograf weess ech aus eegener Erfarung, wéi wichteg richteg Barrierefreiheet am Alldag ass — an dat ass genau dat, wat mech bei Endlech.lu undréift."
    tag_age: "30 Joer"
    tag_sma: "SMA2"
    tag_programmer: "Programméierer"
    tag_photographer: "Fotograf"
    story_title: "D'Geschicht vun Endlech.lu"
    story_intro: "Endlech.lu war eigentlech scho säit Jore iwwerfälleg. D'Iddi hat ech schonn als Jugendlechen — eng Plaz, wou Mënsche mat ageschränkter Mobilitéit onkomplizéiert barrierefrä Restauranten zu Lëtzebuerg fannen kënnen. Eppes, dat et esou einfach an iwwersiichtlech ganz einfach nach net gouf."
    timeline_2018_title: "Planung fänkt un"
    timeline_2018_text: "D'Iddi ass zur konkreter Decisioun gereeft: Ech wollt d'Plattform wierklech bauen. 2018 hunn ech ugefaangen, de Projet seriö ze plangen."
    timeline_2020_title: "Aktiv Entwécklung"
    timeline_2020_text: "Zesumme mat engem Frënd a Partner hunn ech ugefaangen, d'Plattform aktiv ëmzesetzen. Mir hunn d'Visioun gedeelt an hunn mat richtigem Elan dru geschafft."
    timeline_2022_title: "Onfrëiwëlleg Paus"
    timeline_2022_text: "Leider huet et mam Partner net geklappt, an eleng hat ech einfach net d'Zäit. De Projet hunn ech schwéieren Häerzens op Äis geluecht."
    timeline_2025_title: "Neistart"
    timeline_2025_text: "Enn 2025 hunn ech beschloss, nees unzefänken — an et dës Kéier duerchzezéien. Mat neier Energie an dem richtegen Tech-Stack hunn ech d'Entwécklung komplett nei gestart."
    timeline_2026_date: "Mäerz 2026"
    timeline_2026_title: "Éischt Live-Versioun"
    timeline_2026_text: "Am Mäerz 2026 geet Endlech.lu endlech online — mat richtegen Restaurantdaten, Barrierefreiheets-Filteren, Community-Virschléi an engem komplettem Admin-Panel. Den Ufank ass gemaach, an d'Plattform wiisst mat all Bewäertung."
    mission_title: "Eis Missioun"
    mission_text: "Barrierefreiheet soll keen Zoufall sinn. Mat Endlech.lu wëlle mir Mënsche mat ageschränkter Mobilitéit hëllefen, Restauranten zu Lëtzebuerg ze fannen, déi wierklech zougänglech sinn — vun der Community gepréift, fir d'Community."
    mission_cta: "Restauranten entdecken"
    press_teaser_title: "Fir Press a Medien"
    press_teaser_body: "Beschreiwungstexter, aktuell Zuelen, Logoen an een Uspriechpartner — alles op enger Plaz, fräigi fir d'Berichterstattung."
    press_teaser_cta: "Op d'Presssäit"

legal:
    title: "Impressum – Endlech.lu"
    heading: "Impressum"
    info_title: "Informatiounen geméiss § 5 TMG / Art. 11 Loi sur le commerce électronique"
    info_text: "Endlech.lu\nLëtzebuerg"
    responsible_label: "Verantwortlech am Sënn vum Pressrecht"
    contact_title: "Kontakt"
    contact_email_label: "E-Mail:"
    disclaimer_title: "Haftungsausschloss"
    content_title: "Haftung fir Inhalter"
    content_text: "D'Inhalter vun eise Säiten goufe mat gréisster Suergfalt erstallt. Fir d'Richtegkeet, Vollstännegkeet an Aktualitéit vun den Inhalter kënne mir awer keng Garantie iwwerhuelen."
    links_title: "Haftung fir Linken"
    links_text: "Eist Ugebot enthält Linken op extern Websäite vu Drëtten, op deenen hiren Inhalt mir keen Afloss hunn. Dofir kënne mir fir dës friem Inhalter och keng Garantie iwwerhuelen. Fir d'Inhalter vun de verlinkten Säiten ass ëmmer den jeweilegen Ubidder oder Bedreiwer vun de Säite verantwortlech."
    privacy_title: "Dateschutz"
    privacy_text: "D Restaurantlëscht, d Detailsäiten an den offenen Datesaz kann ee ouni Kont an ouni perséinlech Donnéeë benotzen. Wien e Kont uleet, e Restaurant virschléit oder sech op eng Waardelëscht setzt, gëtt dobäi bewosst Donnéeën un — wéi eng dat sinn a wouhin se ginn, steet an de folgenden Abschnitter."
    error_tracking_title: "Feeleranalyse (Sentry)"
    error_tracking_text: "Fir technesch Feeler z'erkennen an ze behiewen, notze mir Sentry (Functional Software, Inc.). Wann op eiser Websäit e Feeler optrëtt, ginn technesch Uginne wéi Zäitpunkt, opgeruffe Säit a Feelermeldung u Serveren an der Europäescher Unioun (Frankfurt um Main) iwwerdroen. IP-Adressen an Notzerdate ginn dobäi net iwwerdroen. Rechtsgrondlag ass eise berechtegten Interessi un engem stabilen a séchere Betrib vun der Websäit no Art. 6 Abs. 1 lit. f DSGVO."
    mail_title: "E-Mail-Versand (Brevo)"
    mail_text: "Fir de Versand vun E-Maile — Bestätegungen, Noriichten, Waardelëschten — benotze mir Brevo (Sendinblue GmbH, Köln). Iwwerdroe ginn d E-Mail-Adress an den Numm vum Empfänger souwéi den Inhalt vun der Noriicht. Rechtsgrondlag ass Art. 6 Abs. 1 lit. b DSGVO respektiv lit. a bei Waardelëscht-Umeldungen. En Optragsveraarbechtungsvertrag läit vir."
    marketing_title: "Newsletter a Kampagnen (Brevo)"
    marketing_text: "Wien beim Androe an eng Waardelëscht oder bei der Umeldung ausdrécklech zoustëmmt, gëtt als Kontakt bei Brevo (Brevo SA, Frankräich) gespäichert — dauerhaft a fir Reklammzwecker, also iwwer de blousse Versand vun enger eenzelner Noriicht eraus. Iwwerdroe ginn: E-Mail-Adress, Numm vun der Kontaktpersoun, Numm vun der Organisatioun respektiv vum Restaurant, Sprooch, d Roll am Verkaf an de Bearbechtungsstand. Fräitext-Noriichten, Telefonsnummeren an Uertsaangabe ginn ausdrécklech net iwwerdroen. Rechtsgrondlag ass Art. 6 Abs. 1 lit. a DSGVO (Zoustëmmung). D Zoustëmmung ass fräiwëlleg, keng Bedingung fir d Umeldung an zu all Moment zréckzezéien — iwwer den Ofmellungslink an all Kampagne oder duerch d Läsche vum Kont. No engem Widderruff gëtt de Kontakt bei Brevo ewechgeholl."
    transit_title: "Haltestellen an der Noperschaft (Verkéiersverbond)"
    transit_text: "Op de Restaurant-Detailsäite weise mir Haltestelle vum ëffentlechen Transport. Dofir froe mir d Schnëttplaz vum Verkéiersverbond un — iwwerdroe ginn ausschliisslech d Koordinate vum Restaurant. Keng Donnéeë vun de Besucher: weder IP-Adress nach Kennung. D Äntwert späichere mir 24 Stonne queschent."
    rights_title: "Deng Rechter"
    rights_intro: "Du hues zu all Moment d Recht op:"
    rights_access: "Auskonft iwwer déi zu dir gespäichert Donnéeën (Art. 15 DSGVO)"
    rights_erasure: "Läschung vun dengem Kont an de verbonnenen Donnéeën (Art. 17 DSGVO)"
    rights_portability: "Iwwerdrobarkeet — eng maschinneliesbar Kopie vun dengen Donnéeën (Art. 20 DSGVO)"
    rights_withdraw: "Widerruff vun denger Awëllegung, zum Beispill bei enger Waardelëscht (Art. 7 Abs. 3 DSGVO)"
    rights_complaint: "Reklamatioun bei der Commission nationale pour la protection des données (CNPD), Lëtzebuerg"
    rights_how: "Auskonft, Export a Läschung mécha du selwer an dengem Profil — direkt an ouni Ufro:"
    rights_profile_link: "bei mäi Profil"
    retention_title: "Späicherdauer"
    retention_text: "Kontdonnéeë späichere mir, soulaang de Kont besteet; no der Läschung verschwanne se direkt. Waardelëscht-Umeldunge bleiwen, bis se zréckgezu ginn oder d Programm ufänkt. Restaurant-Uginn bleiwen dauerhaft — si si Sachuginn a ginn no enger Kontläschung vun der Persoun getrennt."

