boilerplate:
    section_title: "Iwwer Endlech.lu"
    section_intro: "Dräi fräigi Beschreiwungstexter. Si däerfe wuertwiertlech iwwerholl ginn."
    short_label: "Kuerz"
    medium_label: "Mëttel"
    long_label: "Laang"
    word_hint: "ronn %count% Wierder"
    short: "Endlech.lu ass déi offen Plattform fir barrierefrä Gastronomie zu Lëtzebuerg: Fir all erfaasst Lokal steet do, wat wierklech zougänglech ass. Gratis, ouni Reklamm an ëffentlech nozepréiwen."
    medium: "Endlech.lu ass déi offen Plattform fir barrierefrä Gastronomie zu Lëtzebuerg. Fir all erfaasst Lokal steet do, wat zougänglech ass a wat net: Zougang ouni Trap, barrierefrä Toilette, Diirbreet an Dëschofstand a Zentimeter, Assistenzhënn, Beliichtung, Wéckeldësch a Behënnertepark. D'Uginne kommen aus der Communautéit a gi vum Team op der Plaz gepréift. Andrag, Donnéeën a Bewäertung si fir all Restaurant am Land gratis an ëffentlech."
    long: "Endlech.lu ass déi offen Plattform fir barrierefrä Gastronomie zu Lëtzebuerg. Wien op e Rollstull oder op eng Begleedung ugewisen ass, kann haut net plangen, ob e Restaurantbesuch klappt: Weder Kaartendéngschter nach d'Säite vun de Lokaler äntweren op d'Froen, op déi et ukënnt. Endlech.lu äntwert drop — Zougang ouni Trap, barrierefrä Toilette, Diirbreet an Dëschofstand a Zentimeter, Assistenzhënn, Beliichtung, Wéckeldësch, Behënnertepark. D'Uginne kommen aus der Communautéit a gi vum Team op der Plaz gepréift; wat net gemooss gouf, zielt als net erfëllt. Andrag, Donnéeën a Bewäertung si gratis a bleiwen et, fir all Restaurant am Land. De komplette Datesaz steet ënner CC BY 4.0 zum Eroflueden prett, an d'Plattform leet hir Kennzuelen an hir Finanzen ëffentlech op. Online zënter Mäerz 2026."

