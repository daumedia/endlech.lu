    q1: "Barrièrefräiheet soll kee Zoufall sinn. Wien am Rollstull sëtzt, wëll virum Lassfueren wëssen, ob et geet – net eréischt virun der Dier."
    q2: "Wa Bewäertunge kéinte kaaft ginn, wieren se näischt wäert. Dofir bleiwen Andrag, Donnéeën a Punktzuel gratis – fir all Restaurant, ob Partner oder net."

