    role: "Grënner vun Endlech.lu"
    bio: "De Michael Ferreira huet Endlech.lu gegrënnt, well hie d'Lück selwer kennt: Hien ass zënter der Gebuert vun enger Spinaler Muskelatrophie (SMA2) betraff an op e Rollstull ugewisen. Als Programméierer a Fotograf baut hien d'Plattform, déi hie sech als Gaascht ëmmer gewënscht huet."
