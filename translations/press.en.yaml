boilerplate:
    section_title: "About Endlech.lu"
    section_intro: "Three approved descriptions. They may be quoted verbatim."
    short_label: "Short"
    medium_label: "Medium"
    long_label: "Long"
    word_hint: "about %count% words"
    short: "Endlech.lu is the open platform for accessible dining in Luxembourg: for every venue listed, it shows what is actually accessible. Free of charge, free of advertising and publicly verifiable."
    medium: "Endlech.lu is the open platform for accessible dining in Luxembourg. For every venue listed, it shows what is accessible and what is not: step-free entrance, accessible toilet, door width and table spacing in centimetres, assistance dogs, lighting, baby changing table and disabled parking. The information comes from the community and is checked on site by the team. Listing, data and rating stay free and public."
    long: "Endlech.lu is the open platform for accessible dining in Luxembourg. Anyone who uses a wheelchair cannot currently plan whether a restaurant visit will work out: neither mapping services nor the venues' own websites answer the questions that matter. Endlech.lu answers them — step-free entrance, accessible toilet, door width and table spacing in centimetres, assistance dogs, lighting, baby changing table, disabled parking. The information comes from the community and is checked on site by the team; whatever has not been measured counts as not fulfilled. Listing, data and rating stay free for every restaurant in the country. The full dataset is available under CC BY 4.0, and the platform publishes its figures and its finances. Online since March 2026."

