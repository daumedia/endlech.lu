item:
    roadmap_changelog:
        title: "Roteiro público e registo de alterações"
        reason: "Esta própria página. Até agora, quem via de fora não conseguia perceber se ainda se estava a trabalhar na plataforma."
    reviews:
        title: "Avaliações e comentários"
        reason: "Os clientes devem poder deixar a sua própria experiência sobre um estabelecimento, e não apenas ler as características registadas."
    map:
        title: "Vista de mapa"
        reason: "As coordenadas de cada estabelecimento já existem. Falta o mapa que mostra o que há por perto."
    favourites:
        title: "Favoritos"
        reason: "Guardar estabelecimentos sem ter de os procurar sempre de novo — a primeira utilidade de uma conta para além de enviar sugestões."
    ios_app:
        title: "App nativa para iOS"
        reason: "A interface para isso existe desde junho. Se uma app própria compensa depende de haver conteúdo suficiente de que se precise em movimento."
    chat_widget:
        title: "Janela de chat"
        reason: "Uma linha direta para perguntas que nenhum formulário cobre. Antes, é preciso esclarecer quem responde e com que rapidez."
    ai_filter:
        title: "Pesquisa com IA"
        reason: "Uma pesquisa que responda a «com cadeira de rodas, sossegado, aberto ao almoço». O que exatamente deverá fazer ainda não está definido."
    android_and_logins:
        title: "App para Android, início de sessão com Google e Apple"
        reason: "Anotado porque foi pedido. Nenhum dos três pontos foi, até agora, justificado ou priorizado."

shelved_item:
    passkey_conditional_ui:
        title: "Sugestão de chave de acesso no campo de início de sessão"
        reason: "Tecnicamente possível, mas o botão próprio para chaves de acesso cumpre a mesma função sem uma fonte de erros adicional."
    passkey_signup:
        title: "Criar conta com chave de acesso"
        reason: "Uma conta precisa de um endereço de e-mail confirmado. Sem ele, não haveria forma de recuperar a conta se o dispositivo se perdesse."
    passkey_api:
        title: "Chaves de acesso na interface para apps"
        reason: "A app inicia sessão com um token. Uma segunda forma de iniciar sessão não traria aí qualquer proteção adicional."
    passkey_attestation:
        title: "Verificação da origem das chaves de acesso"
        reason: "Uma prova do fabricante da chave de segurança bloquearia dispositivos, sem que ninguém analisasse essas informações."
    apple_splash:
        title: "Ecrãs de arranque para a instalação no iPhone"
        reason: "Uma dúzia de ficheiros de imagem por tamanho de dispositivo, para ter menos uma décima de segundo de ecrã branco."
    pull_to_refresh:
        title: "Puxar para atualizar"
        reason: "A página recarrega a cada acesso. O gesto limitar-se-ia a reproduzir o que o navegador já faz."
    push_notifications:
        title: "Notificações push"
        reason: "Sem um motivo que justifique uma interrupção, uma notificação push é apenas um incómodo. Quando há algo a comunicar, enviamos um e-mail."
    mobile_audit:
        title: "Revisão única de todas as páginas em dispositivos móveis"
        reason: "Em vez de uma revisão única, cada nova página é verificada a 320 píxeis. Isso dura mais."
