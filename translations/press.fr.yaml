    role: "Fondateur d'Endlech.lu"
    bio: "Michael Ferreira a fondé Endlech.lu parce qu'il connaît le problème de l'intérieur : il est atteint d'une amyotrophie spinale (SMA2) depuis sa naissance et se déplace en fauteuil roulant. Programmeur et photographe, il construit la plateforme qu'il a toujours souhaitée en tant que client."
