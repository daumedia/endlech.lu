    q1: "L'accessibilité ne devrait pas être une question de chance. En fauteuil roulant, on veut savoir avant de partir si c'est possible – pas devant la porte."
    q2: "Si nos évaluations étaient à vendre, elles ne vaudraient rien. C'est pourquoi l'inscription, les données et le score restent gratuits – pour chaque restaurant, partenaire ou non."

