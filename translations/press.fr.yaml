    word_hint: "environ %count% mots"
    short: "Endlech.lu est la plateforme ouverte de la gastronomie accessible au Luxembourg : pour chaque établissement recensé, elle indique ce qui est réellement accessible. Gratuit, sans publicité et vérifiable publiquement."
    medium: "Endlech.lu est la plateforme ouverte de la gastronomie accessible au Luxembourg. Pour chaque établissement recensé, elle indique ce qui est accessible : entrée de plain-pied, toilettes accessibles, largeur de porte et espacement des tables en centimètres, chiens d'assistance, éclairage, table à langer, stationnement réservé. Les informations viennent de la communauté et sont vérifiées sur place. Inscription, données et évaluation restent gratuites et publiques."
    long: "Endlech.lu est la plateforme ouverte de la gastronomie accessible au Luxembourg. Une personne en fauteuil roulant ne peut aujourd'hui pas savoir à l'avance si une sortie au restaurant sera possible : ni les services de cartographie ni les sites des établissements ne répondent aux questions qui comptent. Endlech.lu y répond — entrée de plain-pied, toilettes accessibles, largeur de porte et espacement des tables en centimètres, chiens d'assistance, éclairage, table à langer, stationnement réservé. Les informations viennent de la communauté et sont vérifiées sur place ; ce qui n'a pas été mesuré compte comme non rempli. Inscription, données et évaluation restent gratuites pour chaque restaurant du pays. Le jeu de données complet est téléchargeable sous CC BY 4.0. En ligne depuis mars 2026."

