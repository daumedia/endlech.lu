partner:
    meta_title: "Programa de parceiros para restaurantes"
    hero:
        eyebrow: "Programa de parceiros"
        heading: "O seu cliente está à porta — e volta para trás."
        text: "Um degrau à entrada, uma porta demasiado estreita, uma casa de banho na cave: para muitas pessoas no Luxemburgo, a ida ao restaurante termina antes de começar. Ajudamo-lo a identificar e eliminar estas barreiras."
        cta: "Entrar na lista de espera"
    benefits:
        title: "O que recebe como parceiro"
        advisory_title: "Relatório de aconselhamento"
        advisory_text: "Vamos até si, olhamos para o seu estabelecimento com os olhos dos seus clientes e registamos o que funciona bem e o que vale a pena mudar. Concreto, ordenado por esforço, sem jargão técnico."
        box_title: "Inclusion Box"
        box_text: "Materiais para o dia a dia no local: sinalética, autocolantes para a entrada e as janelas, expositores de mesa. Para que os seus clientes saibam com o que podem contar ainda antes de entrar."
        visibility_title: "Visibilidade"
        visibility_text: "Contamos o que mudou — nos nossos canais e no seu perfil. Não como espaço publicitário, mas como exemplo que outros estabelecimentos podem seguir."
    integrity:
        badge: "A nossa promessa"
        heading: "As avaliações não estão à venda."
        text: "Somos uma plataforma de acessibilidade. Se as nossas avaliações pudessem ser compradas, não teriam valor — nem para os seus clientes, nem para si. Por isso, sem exceção:"
        point_1: "A presença na plataforma, os dados de acessibilidade e a pontuação são e continuarão a ser gratuitos e públicos — para todos os restaurantes do Luxemburgo, parceiros ou não."
        point_2: "O selo de verificação depende exclusivamente da acessibilidade verificada. A adesão não altera nada nisso."
        point_3: "A adesão não tem qualquer influência na sua avaliação, na sua posição nos resultados de pesquisa ou na sua visibilidade nos filtros."
    included:
        title: "O que está incluído?"
        subtitle: "Tudo o que tem a ver com a avaliação é gratuito. Paga-se o aconselhamento, os materiais e o acompanhamento."
        caption: "Comparação dos serviços gratuitos com os da adesão de parceiro"
        col_feature: "Serviço"
        col_free: "Gratuito"
        col_partner: "Parceiro"
        row_listing: "Presença em Endlech.lu"
        row_score: "Dados de acessibilidade e pontuação"
        row_badge: "Selo de verificação"
        row_search: "Visibilidade na pesquisa e nos filtros"
        row_report: "Relatório de aconselhamento no local"
        row_box: "Inclusion Box com materiais"
        row_guidance: "Acompanhamento na implementação"
        row_funding: "Apoio no pedido de financiamento"
        row_plaque: "Placa de parceiro (meramente informativa)"
        # Gequotet, weil YAML `yes`/`no` sonst als Boolean liest (wie bei tristate).
        "yes": "incluído"
        "no": "não incluído"
        pricing_note: "Os preços e o conteúdo dos pacotes ainda não estão definidos. Quem estiver na lista de espera será o primeiro a saber — e poderá decidir com calma."
    legal:
        title: "O enquadramento legal"
        law: "A lei luxemburguesa de 7 de janeiro de 2022 relativa à acessibilidade dos locais abertos ao público aplica-se também aos restaurantes existentes. Para estes, o prazo de adaptação decorre até 1 de janeiro de 2032."
        aid: "O Estado comparticipa: são cobertos 50 % dos custos de obras, estudos e aconselhamento, com um limite de 24 000 € sem IVA. Quem começar cedo terá mais escolha de empresas e profissionais e mais tempo para os pedidos."
        link: "Informações em guichet.public.lu"
        link_new_window: "(abre numa nova janela)"
        disclaimer_label: "Nota:"
        disclaimer: "Trata-se de uma informação geral e não de aconselhamento jurídico. Para o seu caso concreto, contacte as entidades competentes ou um serviço de aconselhamento jurídico."
    how:
        title: "Como funciona"
        step1_title: "Entrar na lista de espera"
        step1_text: "Inscreve-se abaixo e confirma o seu endereço de e-mail. Isso não o compromete a nada e não tem qualquer custo."
        step2_title: "Visita e conversa"
        step2_text: "Entramos em contacto, passamos pelo seu estabelecimento e analisamo-lo. Esta primeira visita é gratuita — mesmo que depois diga que não."
        step3_title: "A decisão é sua"
        step3_text: "Nessa altura, já conhece o esforço, os custos e as possibilidades de financiamento. Só depois decide se a adesão faz sentido para si."
    faq:
        title: "Perguntas frequentes"
        q1: "Pagar melhora a nossa pontuação?"
        a1: "Não. A pontuação resulta exclusivamente das características de acessibilidade registadas do seu estabelecimento. Não há bónus, nem posicionamento preferencial, nem forma de a comprar. Se tiver melhores resultados como parceiro, é porque mudou alguma coisa — não porque pagou."
        q2: "E se tivermos maus resultados?"
        a2: "Então esse é o ponto de partida, não o veredicto. Quase todos os estabelecimentos têm pontos onde algo falha. O relatório mostra-lhe quais podem ser resolvidos com pouco esforço e quais implicariam obras maiores. Não publicamos um retrato momentâneo para expor ninguém."
        q3: "A verificação é mesmo gratuita?"
        a3: "Sim. A verificação, a presença na plataforma e todos os dados de acessibilidade são gratuitos e continuarão a sê-lo. Fazem parte da nossa missão pública e não da oferta. Um restaurante que nunca se torne parceiro tem exatamente as mesmas possibilidades na plataforma."
        q4: "Quanto custa a adesão?"
        a4: "Ainda não está definido. Só fixaremos o preço quando o âmbito dos serviços estiver finalizado — tudo o resto seria um palpite. Quem estiver na lista de espera será o primeiro a conhecer os preços e poderá então decidir."
        q5: "Quando começa?"
        a5: "Começamos com um pequeno grupo de estabelecimentos, para podermos dedicar tempo suficiente a cada um. Assim que atribuirmos as primeiras datas de visita, entraremos em contacto consigo — pela ordem das inscrições."
