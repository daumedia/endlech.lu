about:
    title: "Sobre Endlech | Endlech.lu"
    heading: "Sobre Endlech"
    subtitle: "A história por detrás de Endlech.lu — uma plataforma que já tardava há muito."
    founder: "Fundador"
    founder_bio: "Sou o Michael, tenho 30 anos e vivo com SMA2 (atrofia muscular espinhal tipo 2) desde o nascimento. Como programador e fotógrafo apaixonado, sei por experiência própria como a verdadeira acessibilidade é importante no dia a dia — e é exatamente isso que me move em Endlech.lu."
    tag_age: "30 anos"
    tag_sma: "SMA2"
    tag_programmer: "Programador"
    tag_photographer: "Fotógrafo"
    story_title: "A história de Endlech.lu"
    story_intro: "Na verdade, Endlech.lu já devia existir há anos. Tive a ideia ainda na adolescência — um lugar onde pessoas com mobilidade reduzida pudessem encontrar facilmente restaurantes acessíveis no Luxemburgo. Algo que, de forma tão simples e clara, simplesmente ainda não existia."
    timeline_2018_title: "Início do planeamento"
    timeline_2018_text: "A ideia amadureceu até se tornar uma decisão concreta: eu queria mesmo construir a plataforma. Em 2018, comecei a planear o projeto a sério."
    timeline_2020_title: "Desenvolvimento ativo"
    timeline_2020_text: "Juntamente com um amigo e parceiro, comecei a pôr a plataforma em prática. Partilhávamos a visão e trabalhámos nela com verdadeiro entusiasmo."
    timeline_2022_title: "Pausa involuntária"
    timeline_2022_text: "Infelizmente, as coisas não correram bem com o parceiro e, sozinho, faltava-me simplesmente o tempo. Com grande pena, tive de pôr o projeto em suspenso."
    timeline_2025_title: "Recomeço"
    timeline_2025_text: "No final de 2025, decidi recomeçar — e, desta vez, levar o projeto até ao fim. Com nova energia e a stack tecnológica certa, reiniciei o desenvolvimento do zero."
    timeline_2026_date: "março de 2026"
    timeline_2026_title: "Primeira versão online"
    timeline_2026_text: "Em março de 2026, Endlech.lu fica finalmente online — com dados reais de restaurantes, filtros de acessibilidade, sugestões da comunidade e um painel de administração completo. O primeiro passo está dado, e a plataforma cresce com cada avaliação."
    mission_title: "A nossa missão"
    mission_text: "A acessibilidade não deve ser uma questão de sorte. Com Endlech.lu, queremos ajudar pessoas com mobilidade reduzida a encontrar restaurantes no Luxemburgo que sejam verdadeiramente acessíveis — verificados pela comunidade, para a comunidade."
    mission_cta: "Descobrir restaurantes"
    press_teaser_title: "Para a imprensa e os meios de comunicação"
    press_teaser_body: "Textos de apresentação, números atuais, logótipos e uma pessoa de contacto — num só lugar, disponíveis para utilização jornalística."
    press_teaser_cta: "Ir para a página de imprensa"

legal:
    title: "Aviso legal – Endlech.lu"
    heading: "Aviso legal"
    info_title: "Informações nos termos do art. 5.º da Loi du 14 août 2000 relative au commerce électronique (corresponde ao § 5 da DDG)"
    info_text: "Endlech.lu\nLuxemburgo"
    responsible_label: "Representado pelo gerente"
    rcs_label: "Registo comercial (RCS Luxembourg):"
    authorisation_label: "Autorização de estabelecimento:"
    authority_label: "Emitida por:"
    authority_value: "Ministère de l’Économie, Direction générale des classes moyennes, Luxemburgo"
    vat_label: "Número de IVA:"
    contact_title: "Contacto"
    contact_email_label: "E-mail:"
    disclaimer_title: "Exclusão de responsabilidade"
    content_title: "Responsabilidade pelos conteúdos"
    content_text: "Os conteúdos das nossas páginas foram elaborados com o máximo cuidado. No entanto, não podemos garantir a exatidão, a completude e a atualidade dos conteúdos."
    links_title: "Responsabilidade pelas ligações"
    links_text: "A nossa oferta contém ligações para sítios web externos de terceiros, sobre cujos conteúdos não temos qualquer influência. Por isso, também não podemos dar qualquer garantia relativamente a esses conteúdos alheios. O respetivo fornecedor ou operador das páginas é sempre o responsável pelos conteúdos das páginas para as quais remetem as ligações."
    privacy_title: "Proteção de dados"
    privacy_text: "A lista de restaurantes, as páginas de detalhe e o conjunto de dados aberto podem ser utilizados sem conta e sem fornecer dados pessoais. Quem cria uma conta, sugere um restaurante ou se inscreve numa lista de espera fornece dados de forma consciente — quais são esses dados e para onde vão está descrito nas secções seguintes. O responsável pelo tratamento é o operador acima indicado."
    hosting_title: "Funcionamento do sítio web (Hostinger)"
    hosting_text: "Este sítio web, o serviço em segundo plano para o envio de e-mails e a base de dados funcionam num servidor da Hostinger International Ltd. (Larnaca, Chipre). O servidor está localizado na Alemanha. Assim, a Hostinger trata, na qualidade de subcontratante, todos os dados gerados neste sítio — incluindo os registos de acesso do servidor web. O fundamento jurídico é o nosso interesse legítimo no funcionamento seguro do sítio web, nos termos do art. 6.º, n.º 1, alínea f), do RGPD. Existe um contrato de subcontratação."
    error_tracking_title: "Análise de erros (Sentry)"
    error_tracking_text: "Para detetar e corrigir erros técnicos, utilizamos o Sentry (Functional Software, Inc.). Se ocorrer um erro no nosso sítio web, são transmitidas informações técnicas, como a hora, a página acedida e a mensagem de erro, para servidores na União Europeia (Frankfurt am Main). Não são transmitidos endereços IP nem dados de utilizadores. O fundamento jurídico é o nosso interesse legítimo num funcionamento estável e seguro do sítio web, nos termos do art. 6.º, n.º 1, alínea f), do RGPD."
    usage_title: "Medição de utilização (Umami, operado por nós)"
    usage_text: "Para perceber que páginas são lidas e em que ponto os visitantes abandonam a pesquisa de restaurantes ou um formulário, medimos a utilização com o Umami. Operamos o Umami nós próprios, num servidor próprio na Hostinger International Ltd.; o servidor está localizado na Alemanha. Nada é enviado ao criador do Umami nem a terceiros. São registados: a página acedida sem parâmetros de pesquisa, o domínio da página de onde veio, o país, a região e a cidade, o tipo de navegador e de dispositivo, o tamanho do ecrã e o idioma, bem como eventos como «Filtro aplicado» ou «Meio de contacto utilizado» — nos meios de contacto, apenas o tipo, nunca o número ou o endereço. Para agrupar as visualizações de uma mesma visita, o Umami gera, a partir de características da visita, um identificador de sessão que muda mensalmente. O seu endereço IP é utilizado para esse efeito, mas não é armazenado. Não são definidos cookies e nada é associado a uma conta ou ao conteúdo de formulários. A administração e o perfil não são medidos. Conservamos os dados de medição sem limite de tempo, para podermos comparar o alcance ao longo dos anos. Se o seu navegador enviar «Do Not Track» ou «Global Privacy Control», não é feita qualquer medição; o mesmo acontece sem JavaScript. O fundamento jurídico é o nosso interesse legítimo numa plataforma que chegue efetivamente aos seus visitantes, nos termos do art. 6.º, n.º 1, alínea f), do RGPD. Pode opor-se à medição a qualquer momento:"
    usage_switch_label: "Medição de utilização neste navegador"
    usage_switch_on: "ligada"
    usage_switch_off: "desligada"
    usage_switch_hint: "A definição aplica-se a este navegador e fica guardada no armazenamento do navegador, não num cookie. Quem limpar o armazenamento do navegador anula a oposição."
    usage_switch_unavailable: "O interruptor não está disponível neste navegador, porque o armazenamento do navegador está bloqueado."
    usage_switch_noscript: "Sem JavaScript não é feita qualquer medição — aqui não há nada a configurar."
    mail_title: "Envio de e-mails (Brevo)"
    mail_text: "Para o envio de e-mails — confirmações, notificações, listas de espera — utilizamos a Brevo (Brevo SA, 7 rue de Madrid, 75008 Paris, França). São transmitidos o endereço de e-mail e o nome do destinatário, bem como o conteúdo da respetiva mensagem. O fundamento jurídico é o art. 6.º, n.º 1, alínea b), do RGPD (execução de diligências pré-contratuais) ou, no caso de inscrições em listas de espera, a alínea a). Existe um contrato de subcontratação."
    marketing_title: "Newsletter e campanhas (Brevo)"
    marketing_text: "Quem, ao inscrever-se numa lista de espera ou ao registar-se, der expressamente o seu consentimento é guardado como contacto na Brevo (Brevo SA, França) — de forma permanente e para fins publicitários, ou seja, para além do simples envio de uma mensagem individual. São transmitidos: endereço de e-mail, nome da pessoa de contacto, nome da organização ou do restaurante, idioma, a função no processo comercial e o estado do processamento. Fica expressamente excluída a transmissão de mensagens de texto livre, números de telefone e indicações de localidade. O fundamento jurídico é o art. 6.º, n.º 1, alínea a), do RGPD (consentimento). O consentimento é voluntário, não é condição para a inscrição e pode ser retirado a qualquer momento — através da ligação para cancelar a subscrição presente em cada campanha ou eliminando a conta. Após a retirada do consentimento, o contacto é removido da Brevo."
    transit_title: "Paragens nas proximidades (Verkéiersverbond)"
    transit_text: "Nas páginas de detalhe dos restaurantes, mostramos paragens de transportes públicos. Para isso, consultamos a interface do Verkéiersverbond — são transmitidas exclusivamente as coordenadas do restaurante. Nenhum dado dos visitantes: nem endereço IP, nem identificador. Guardamos a resposta em cache durante 24 horas."
    transfer_title: "Transferência para países terceiros"
    transfer_text: "Todos os serviços que contratamos diretamente têm sede na União Europeia. No entanto, estes recorrem, por sua vez e em parte, a subcontratantes ulteriores fora da UE — em particular nos Estados Unidos. Trata-se de serviços técnicos: entrega e proteção contra falhas, análise e apoio aos utilizadores. Estas transferências estão salvaguardadas pelo Quadro de Privacidade de Dados UE-EUA (EU-US Data Privacy Framework) ou pelas cláusulas contratuais-tipo da Comissão Europeia. As listas completas constam dos contratos de subcontratação de cada fornecedor."
    rights_title: "Os seus direitos"
    rights_intro: "Tem, a qualquer momento, direito a:"
    rights_access: "acesso aos dados guardados sobre si (art. 15.º do RGPD)"
    rights_erasure: "apagamento da sua conta e dos dados associados (art. 17.º do RGPD)"
    rights_portability: "portabilidade — uma cópia dos seus dados legível por máquina (art. 20.º do RGPD)"
    rights_withdraw: "retirada do seu consentimento, por exemplo relativo a uma inscrição numa lista de espera (art. 7.º, n.º 3, do RGPD)"
    rights_complaint: "apresentação de reclamação junto da Commission nationale pour la protection des données (CNPD), Luxemburgo"
    rights_how: "O acesso, a exportação e o apagamento são feitos por si no seu perfil — de imediato e sem necessidade de pedido:"
    rights_profile_link: "ir para o meu perfil"
    retention_title: "Prazo de conservação"
    retention_text: "Conservamos os dados da conta enquanto a conta existir; após a eliminação, desaparecem imediatamente. As inscrições em listas de espera mantêm-se até serem retiradas ou até ao arranque do programa. As informações sobre restaurantes mantêm-se permanentemente — são dados factuais e, após a eliminação de uma conta, são desassociadas da pessoa. Os dados da medição de utilização são conservados sem limite de tempo; não contêm endereço IP nem qualquer ligação a uma conta."

criteria:
    score_title: "Como é calculada a pontuação"
    score_intro: "Na página de transparência e no conjunto de dados aberto, cada restaurante tem uma pontuação de 0 a 10. Esta resulta de oito características com o mesmo peso:"
    score_wheelchair: "Acesso sem degraus"
    score_toilet: "Casa de banho acessível"
    score_dogs: "Cães de assistência bem-vindos"
    score_lighting: "Boa iluminação"
    score_changing_table: "Fraldário"
    score_parking: "Estacionamento reservado a pessoas com deficiência"
    score_door_width: "Largura da porta de, pelo menos, 90 cm (DIN 18040)"
    score_table_spacing: "Espaço entre mesas de, pelo menos, 90 cm (DIN 18040)"
    score_unmeasured: "Importante: o que não registámos conta como não cumprido. A pontuação mede, portanto, a acessibilidade documentada — não a acessibilidade real. Um restaurante sobre o qual não sabemos nada recebe 0 em 10, mesmo que no local esteja tudo em ordem."
    score_where: "Os números atuais estão na página de transparência:"
    score_open_link: "ir para /open"
    title: "Critérios de acessibilidade – Endlech.lu"
    heading: "Critérios de acessibilidade"
    intro: "Estes critérios ajudam-nos a avaliar objetivamente a acessibilidade dos restaurantes. Cada restaurante é avaliado com base nos seguintes pontos."
    entrance_title: "Entrada acessível"
    entrance_text: "A entrada é acessível sem degraus nem soleiras, ou existe uma rampa. Portas automáticas ou fáceis de abrir são uma vantagem."
    parking_title: "Estacionamento reservado a pessoas com deficiência"
    parking_text: "Existe um lugar de estacionamento assinalado para pessoas com deficiência na proximidade imediata da entrada."
    toilet_title: "Casa de banho acessível"
    toilet_text: "Existe uma casa de banho adaptada a cadeiras de rodas, com espaço de manobra suficiente, barras de apoio e lavatório ao alcance."
    interior_title: "Interior adaptado a cadeiras de rodas"
    interior_text: "Corredores suficientemente largos (pelo menos 90 cm), mesas com espaço livre por baixo para cadeira de rodas e espaço suficiente entre os lugares permitem circular de forma autónoma."
    staff_title: "Pessoal prestável"
    staff_text: "O pessoal está sensibilizado e disposto a apoiar ativamente pessoas com limitações – sem ser intrusivo."
    menu_title: "Ementa fácil de ler"
    menu_text: "A ementa está impressa num tamanho de letra fácil de ler ou está disponível em formato digital. Versões em braille ou em letra ampliada são mais uma vantagem."
    note_label: "Nota:"
    note_text: "As avaliações em Endlech.lu baseiam-se nas experiências da nossa comunidade. A acessibilidade pode variar consoante as necessidades individuais. Recomendamos que se informe diretamente junto do restaurante antes da visita."

