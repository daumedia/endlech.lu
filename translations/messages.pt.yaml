        other: "Outra coisa"
    commune:
        title: "Para comunas"
        intro: "Fazemos o levantamento da restauração da sua comuna no local – estabelecimento a estabelecimento, segundo os mesmos critérios usados em qualquer outro ponto de Endlech.lu. No final, fica a saber em que ponto está a sua comuna, e os seus habitantes também o podem ver."
        scope_title: "O que o levantamento abrange"
        scope_1: "Visita no local a cada estabelecimento participante, juntamente com pessoas que dependem elas próprias de acessibilidade."
        scope_2: "Registo segundo os critérios públicos: entrada, casa de banho, iluminação, cães de assistência, fraldário, estacionamento reservado a pessoas com deficiência."
        scope_3: "Fotografias e medidas, sempre que sejam necessárias para a avaliação."
        scope_4: "Indicações sobre que obstáculos se podem eliminar com pouco esforço e quais exigem obras."
        deliverables_title: "O que recebe"
        deliverable_1_title: "Mapa público"
        deliverable_1_text: "Todos os estabelecimentos registados da sua comuna em Endlech.lu – de acesso livre para todos."
        deliverable_2_title: "Relatório escrito"
        deliverable_2_text: "Preparado para o conselho comunal: situação de partida, aspetos a destacar, recomendações de ação."
        deliverable_3_title: "Apresentação"
        deliverable_3_text: "Apresentamos pessoalmente os resultados no conselho comunal ou numa comissão."
        duration_title: "Quanto tempo demora"
        duration_text: "Entre a encomenda e o relatório passam oito a dezasseis semanas, consoante o número de estabelecimentos. As visitas propriamente ditas são agendadas, em acordo consigo, para algumas semanas consecutivas, para que os resultados se mantenham comparáveis."
        no_guarantee_title: "Paga o levantamento, não o resultado."
        no_guarantee_text: "Não é uma formalidade, é a essência da questão: não prometemos que a sua comuna obtenha bons resultados. Os valores são o que são e são publicados – mesmo quando são incómodos. Um resultado que se pudesse comprar não teria qualquer valor para os seus habitantes."
        law_title: "O enquadramento jurídico"
        law_text: "A lei de 7 de janeiro de 2022 relativa à acessibilidade dos locais abertos ao público aplica-se também aos restaurantes existentes; para estes, o prazo decorre até 1 de janeiro de 2032. Um levantamento mostra-lhe atempadamente quantos estabelecimentos da sua comuna são abrangidos."
        law_disclaimer: "Informação geral, não constitui aconselhamento jurídico."
        pricing: "O preço depende do número de estabelecimentos e é calculado caso a caso. Diga-nos aproximadamente quantos estabelecimentos tem – receberá uma proposta concreta."
        cta: "Pedir levantamento"
    company:
        title: "Para empresas"
        intro: "Pode ajudar a financiar a acessibilidade no Luxemburgo sem receber nada que outros não recebam. O que obtém é a menção como apoiante – nenhuma avaliação melhor, nenhum posicionamento preferencial, nenhuma influência nos conteúdos."
        formats_title: "Formatos"
        format_1_title: "Financiar Inclusion Boxes"
        format_1_text: "Materiais para restaurantes: sinalética, autocolantes, expositores de mesa. Uma caixa abrange um estabelecimento."
        format_2_title: "Colaboradores como participantes nos testes"
        format_2_text: "A sua equipa acompanha os levantamentos no local. Isso dá-nos mãos e dá aos seus colaboradores uma perspetiva que é difícil de transmitir a partir do escritório."
        format_3_title: "Cofinanciar uma comuna"
        format_3_text: "Nem todas as comunas têm orçamento. Pode assumir o levantamento de uma comuna específica."
        format_4_title: "Traduções e workshops"
        format_4_text: "A plataforma existe em luxemburguês, alemão, francês, inglês e português. As traduções e as formações para profissionais da restauração custam dinheiro que não vem de quotas de membros."
        exclusion_title: "Quem não aceitamos como patrocinador"
        exclusion_text: "Para que as nossas recomendações continuem a ter valor, não aceitamos dinheiro de empresas que possam beneficiar precisamente dessas recomendações:"
        exclusion_1: "Cadeias de restauração e estabelecimentos que são eles próprios avaliados em Endlech.lu."
        exclusion_2: "Empresas que executam obras de adaptação para acessibilidade."
        exclusion_3: "Fabricantes e fornecedores de produtos que poderíamos mencionar em relatórios de consultoria."
        exclusion_reason: "Esta regra está aqui publicada para que nos possam pedir contas por ela. Na dúvida, recusamos."
        cta: "Pedir informações sobre patrocínio"
    association:
        title: "Para organizações e associações"
        intro: "Medimos a acessibilidade – mas quem define o que é medido e que peso tem? Não queremos tomar essa decisão sozinhos. É para isso que existe o conselho consultivo."
        decides_title: "Sobre o que decide o conselho consultivo"
        decides_1: "Que critérios são recolhidos e como são definidos."
        decides_2: "Com que peso cada critério entra na pontuação."
        decides_3: "Quando se altera uma metodologia de avaliação – e como isso é documentado publicamente."
        meetings_title: "Com que frequência"
        meetings_text: "Duas reuniões fixas por ano e, se surgir algo entretanto, uma ronda por escrito. Também é possível participar à distância."
        public_title: "Identificados publicamente"
        public_text: "Os membros do conselho consultivo figuram na página com o nome e a organização. Quem ajuda a decidir sobre os critérios deve ser identificável."
        no_money_title: "Aqui não circula dinheiro em nenhum sentido."
        no_money_text: "O conselho consultivo não é patrocínio nem uma relação com um cliente. Não paga nada e não recebe honorários. É precisamente isso que torna a colaboração credível: quem ajuda a definir os critérios não pode depender economicamente deles."
        cta: "Manifestar interesse no conselho consultivo"
    integrity:
