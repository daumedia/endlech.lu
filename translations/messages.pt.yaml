        heading: "As avaliações não estão à venda."
        text: "Seja comuna, patrocinador ou membro do conselho consultivo: ninguém pode influenciar a avaliação de um restaurante. Isto aplica-se sem exceção e sem margem de discricionariedade."
        point_1: "Os dados de acessibilidade, as pontuações e os rankings são gratuitos, públicos e iguais para todos os restaurantes – independentemente de alguém ter pago o levantamento."
        point_2: "Uma comuna que encomenda um levantamento recebe os números que dele resultarem. Nenhum estabelecimento é favorecido por a comuna pagar."
        point_3: "Os patrocinadores e os membros do conselho consultivo não têm acesso a avaliações individuais e não podem mandar alterar nenhum registo."
