person:
    section_title: "Fundador"
    role: "Fundador de Endlech.lu"
    bio: "Michael Ferreira fundou Endlech.lu porque conhece esta lacuna por experiência própria: tem atrofia muscular espinhal (SMA2) desde o nascimento e depende de uma cadeira de rodas. Programador e fotógrafo, está a construir a plataforma que sempre desejou enquanto cliente."
    photo_credit: "Foto: Michael Ferreira (autorretrato), Endlech.lu"
    photo_terms: "O retrato só pode ser utilizado no contexto de reportagens sobre Endlech.lu."

quotes:
    section_title: "Citações"
    release_note: "Estas citações estão aprovadas e podem ser utilizadas sem nos contactar primeiro."
    q1: "A acessibilidade não deve ser obra do acaso. Quem anda de cadeira de rodas quer saber, antes de sair, se vai ser possível – e não só quando já está à porta."
    q2: "Se as nossas avaliações estivessem à venda, não teriam qualquer valor. Por isso, o registo, os dados e a pontuação continuam gratuitos – para todos os restaurantes, sejam parceiros ou não."

