boilerplate:
    section_title: "Sobre Endlech.lu"
    section_intro: "Três textos de apresentação aprovados. Podem ser reproduzidos na íntegra."
    short_label: "Curto"
    medium_label: "Médio"
    long_label: "Longo"
    word_hint: "cerca de %count% palavras"
    short: "Endlech.lu é a plataforma aberta para a restauração acessível no Luxemburgo: para cada estabelecimento registado, indica o que é realmente acessível. Gratuita, sem publicidade e verificável publicamente."
    medium: "Endlech.lu é a plataforma aberta da restauração acessível no Luxemburgo. Para cada estabelecimento registado, mostra o que é ou não acessível: entrada sem degraus, casa de banho acessível, largura da porta e espaço entre mesas em centímetros, cães de assistência, iluminação, fraldário e estacionamento para pessoas com deficiência. Informações da comunidade, verificadas no local pela equipa. Registo, dados e avaliação são gratuitos e públicos para qualquer restaurante."
    long: "Endlech.lu é a plataforma aberta da restauração acessível no Luxemburgo. Quem depende de cadeira de rodas ou de acompanhante não consegue hoje planear se a ida ao restaurante corre bem: nem os mapas online nem os sites dos restaurantes respondem às perguntas essenciais. Endlech.lu responde-lhes — entrada sem degraus, casa de banho acessível, largura da porta e espaço entre mesas em centímetros, cães de assistência, iluminação, fraldário, estacionamento para pessoas com deficiência. Informações da comunidade, verificadas no local pela equipa; o que não foi medido conta como não cumprido. Registo, dados e avaliação são e continuarão gratuitos para qualquer restaurante do país. Os dados completos podem ser transferidos sob CC BY 4.0 e a plataforma publica indicadores e finanças. Online desde março de 2026."

