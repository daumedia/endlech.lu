        data_access: "Accès aux données agrégées"
        joint_communication: "Communication commune"
        referrals: "Recommandation à notre public"
        other: "Autre chose"
    commune:
        title: "Pour les communes"
        intro: "Nous recensons la restauration de votre commune sur place — établissement par établissement, selon les mêmes critères que partout sur Endlech.lu. À la fin, vous savez où en est votre commune, et vos habitants le voient aussi."
        scope_title: "Ce que couvre le recensement"
        scope_1: "La visite de chaque établissement participant, accompagnée de personnes qui dépendent elles-mêmes de l'accessibilité."
        scope_2: "Le relevé selon les critères publics : entrée, WC, éclairage, chiens d’assistance, table à langer, place de parking PMR."
        scope_3: "Photos et mesures là où elles sont nécessaires à l'évaluation."
        scope_4: "Des indications sur les obstacles qui se corrigent facilement et ceux qui relèvent du bâti."
        deliverables_title: "Ce que vous recevez"
        deliverable_1_title: "Carte publique"
        deliverable_1_text: "Tous les établissements recensés de votre commune sur Endlech.lu — en libre accès pour tous."
        deliverable_2_title: "Rapport écrit"
        deliverable_2_text: "Préparé pour le conseil communal : état des lieux, constats, recommandations."
        deliverable_3_title: "Présentation"
        deliverable_3_text: "Nous présentons les résultats en personne au conseil communal ou en commission."
        duration_title: "Combien de temps cela prend"
        duration_text: "De la commande au rapport, comptez huit à seize semaines selon le nombre d'établissements. Les visites elles-mêmes sont regroupées, en concertation, sur quelques semaines consécutives afin que les résultats restent comparables."
        no_guarantee_title: "Vous payez le recensement, pas le résultat."
        no_guarantee_text: "Ce n'est pas une formalité, c'est le cœur du sujet : nous ne promettons pas que votre commune obtiendra un bon résultat. Les valeurs sont ce qu'elles sont, et elles sont publiées — même lorsqu'elles dérangent. Un résultat que l'on pourrait acheter ne vaudrait rien pour vos habitants."
        law_title: "Le contexte légal"
        law_text: "La loi du 7 janvier 2022 sur l'accessibilité des lieux ouverts au public s'applique aussi aux restaurants existants ; pour eux, le délai court jusqu'au 1er janvier 2032. Un recensement vous montre tôt combien d'établissements de votre commune sont concernés."
        law_disclaimer: "Information générale, pas un conseil juridique."
        pricing: "Le prix dépend du nombre d'établissements et fait l'objet d'un devis individuel. Indiquez-nous approximativement combien vous en comptez — vous recevrez une offre concrète."
        cta: "Demander un recensement"
    company:
        title: "Pour les entreprises"
        intro: "Vous pouvez cofinancer l'accessibilité au Luxembourg sans obtenir quoi que ce soit que les autres n'ont pas. Ce que vous recevez, c'est d'être cité comme soutien — pas une meilleure évaluation, pas de placement privilégié, aucune influence sur les contenus."
        formats_title: "Formats"
        format_1_title: "Financer des Inclusion Boxes"
        format_1_text: "Du matériel pour les restaurants : panneaux, autocollants, chevalets de table. Une box couvre un établissement."
        format_2_title: "Collaborateurs comme testeurs"
        format_2_text: "Votre équipe accompagne les recensements sur place. Cela nous apporte des bras et offre à vos collaborateurs une perspective difficile à transmettre depuis un bureau."
        format_3_title: "Cofinancer une commune"
        format_3_text: "Toutes les communes n'ont pas de budget. Vous pouvez prendre en charge le recensement d'une commune précise."
        format_4_title: "Traductions et ateliers"
        format_4_text: "La plateforme existe en luxembourgeois, allemand, français et anglais. Les traductions et les formations pour restaurateurs coûtent de l'argent qui ne provient pas des cotisations."
        exclusion_title: "Les sponsors que nous n'acceptons pas"
        exclusion_text: "Pour que nos recommandations gardent leur valeur, nous n'acceptons pas d'argent d'entreprises qui pourraient précisément en profiter :"
        exclusion_1: "Chaînes de restauration et établissements eux-mêmes évalués sur Endlech.lu."
        exclusion_2: "Entreprises qui réalisent des travaux d'accessibilité."
        exclusion_3: "Fabricants et fournisseurs de produits que nous pourrions citer dans des rapports de conseil."
        exclusion_reason: "Cette règle figure ici publiquement pour qu'on puisse nous y tenir. En cas de doute, nous déclinons."
        cta: "Demander un sponsoring"
    association:
        title: "Pour les organisations et associations"
        intro: "Nous mesurons l'accessibilité — mais qui définit ce qui est mesuré et le poids de chaque critère ? Cette décision, nous ne voulons pas la prendre seuls. C'est à cela que sert le comité consultatif."
        decides_title: "Ce que décide le comité consultatif"
        decides_1: "Quels critères sont relevés et comment ils sont définis."
        decides_2: "Le poids de chaque critère dans le score."
        decides_3: "Quand une méthodologie d'évaluation change — et comment cela est documenté publiquement."
        meetings_title: "À quelle fréquence"
        meetings_text: "Deux réunions fixes par an, plus un tour écrit si quelque chose survient entre-temps. La participation à distance est possible."
        public_title: "Nommés publiquement"
        public_text: "Les membres du comité figurent sur le site avec leur organisation et leur nom. Qui participe aux décisions sur les critères doit être identifiable."
        no_money_title: "Aucun argent ne circule, dans aucun sens."
        no_money_text: "Le comité consultatif n'est ni un sponsoring ni une relation client. Vous ne payez rien et vous ne recevez aucune rémunération. C'est précisément ce qui rend cette participation crédible : qui contribue à définir les critères ne doit pas en dépendre économiquement."
        cta: "Manifester son intérêt pour le comité"
    integrity:
        badge: "Identique pour les trois"
        heading: "Les évaluations ne sont pas à vendre."
        text: "Commune, sponsor ou membre du comité : personne ne peut influencer l'évaluation d'un restaurant. Cela vaut sans exception et sans marge d'appréciation."
        point_1: "Les données d'accessibilité, les scores et les classements sont gratuits, publics et identiques pour tous les restaurants — que quelqu'un ait payé le recensement ou non."
        point_2: "Une commune qui commande un recensement obtient les chiffres qui en ressortent. Aucun établissement n'est avantagé parce que la commune paie."
        point_3: "Les sponsors et les membres du comité n'ont pas accès aux évaluations individuelles et ne peuvent pas faire modifier une fiche."
    form:
