partner:
    meta_title: "Programme partenaire pour les restaurants"
    hero:
        eyebrow: "Programme partenaire"
        heading: "Votre client est devant la porte — et fait demi-tour."
        text: "Une marche à l'entrée, une porte trop étroite, des toilettes au sous-sol : pour beaucoup de personnes au Luxembourg, la visite au restaurant se termine avant d'avoir commencé. Nous vous aidons à repérer ces obstacles et à les supprimer."
        cta: "S'inscrire sur la liste d'attente"
    benefits:
        title: "Ce que vous obtenez en tant que partenaire"
        advisory_title: "Rapport de conseil"
        advisory_text: "Nous venons chez vous, regardons votre établissement avec les yeux de vos clients et notons ce qui fonctionne et ce qui vaut la peine d'être changé. Concret, classé par effort, sans jargon."
        box_title: "Inclusion Box"
        box_text: "Du matériel pour le quotidien sur place : panneaux d'information, autocollants pour l'entrée et les vitrines, chevalets de table. Pour que vos clients sachent à quoi s'en tenir avant même d'entrer."
        visibility_title: "Visibilité"
        visibility_text: "Nous racontons ce que vous avez changé — sur nos canaux et sur votre profil. Pas comme un espace publicitaire, mais comme un exemple que d'autres établissements peuvent suivre."
    integrity:
        badge: "Notre engagement"
        heading: "Une évaluation, cela ne s’achète pas."
        text: "Nous sommes une plateforme dédiée à l'accessibilité. Si nos évaluations pouvaient s'acheter, elles ne vaudraient rien — ni pour vos clients, ni pour vous. C'est pourquoi, sans exception :"
        point_1: "L'inscription, les données d'accessibilité et le score sont gratuits et publics, et le resteront — pour chaque restaurant du Luxembourg, partenaire ou non."
        point_2: "Le badge de vérification dépend uniquement de l'accessibilité constatée. L'adhésion n'y change rien."
        point_3: "L'adhésion n'a aucune influence sur votre évaluation, votre position dans les résultats de recherche ou votre visibilité dans les filtres."
    included:
        title: "Que comprend l’offre ?"
        subtitle: "Tout ce qui touche à l'évaluation est gratuit. Ce qui est payant, c'est le conseil, le matériel et l'accompagnement."
        caption: "Comparaison des prestations gratuites et de celles de l'adhésion partenaire"
        col_feature: "Prestation"
        col_free: "Gratuit"
        col_partner: "Partenaire"
        row_listing: "Inscription sur Endlech.lu"
        row_score: "Données d'accessibilité et score"
        row_badge: "Badge de vérification"
        row_search: "Visibilité dans la recherche et les filtres"
        row_report: "Rapport de conseil sur place"
        row_box: "Inclusion Box avec matériel"
        row_guidance: "Accompagnement de la mise en œuvre"
        row_funding: "Aide à la demande de subvention"
        row_plaque: "Plaque partenaire (à titre informatif)"
        # Gequotet, weil YAML `yes`/`no` sonst als Boolean liest (wie bei tristate).
        "yes": "inclus"
        "no": "non inclus"
        pricing_note: "Les prix et le contenu des formules ne sont pas encore fixés. Les personnes inscrites sur la liste d'attente seront informées en premier — et pourront ensuite décider en toute tranquillité."
    legal:
        title: "Le cadre légal"
        law: "La loi luxembourgeoise du 7 janvier 2022 sur l’accessibilité des lieux ouverts au public s’applique aussi aux restaurants existants. Pour eux, le délai de mise en conformité court jusqu’au 1er janvier 2032."
        aid: "L'État participe : 50 % des coûts des travaux, études et conseils sont pris en charge, dans la limite de 24 000 € HTVA. Commencer tôt, c'est plus de choix d'artisans et plus de temps pour les démarches."
        link: "Informations sur guichet.public.lu"
        link_new_window: "(ouvre dans une nouvelle fenêtre)"
        disclaimer_label: "À noter :"
        disclaimer: "Il s'agit d'une information générale et non d'un conseil juridique. Pour votre cas précis, adressez-vous aux services compétents ou à un conseil juridique."
    how:
        title: "Comment cela se passe"
        step1_title: "S'inscrire sur la liste"
        step1_text: "Vous vous inscrivez ci-dessous et confirmez votre adresse e-mail. Cela n'engage à rien et ne coûte rien."
        step2_title: "Visite et échange"
        step2_text: "Nous vous contactons, passons vous voir et examinons votre établissement. Cette première visite est gratuite — même si vous dites non ensuite."
        step3_title: "Vous décidez"
        step3_text: "Vous connaissez alors l'effort, les coûts et les possibilités de subvention. Ce n'est qu'ensuite que vous décidez si une adhésion a du sens pour vous."
    faq:
        title: "Questions fréquentes"
        q1: "Payer améliore-t-il notre score ?"
        a1: "Non. Le score découle uniquement des caractéristiques d'accessibilité relevées dans votre établissement. Il n'y a ni bonus, ni placement privilégié, ni moyen de l'acheter. Si vous obtenez un meilleur score en tant que partenaire, c'est parce que vous avez changé quelque chose — pas parce que vous avez payé."
        q2: "Et si notre résultat est mauvais ?"
        a2: "Alors c'est un point de départ, pas un verdict. Presque chaque établissement a des endroits qui coincent. Le rapport vous montre lesquels se corrigent avec peu d'efforts et lesquels demanderaient de vrais travaux. Nous ne publions pas un instantané pour montrer qui que ce soit du doigt."
        q3: "La vérification est-elle vraiment gratuite ?"
        a3: "Oui. La vérification, l'inscription et toutes les données d'accessibilité sont gratuites et le resteront. C'est notre mission publique, pas une partie de l'offre. Un restaurant qui ne deviendra jamais partenaire dispose exactement des mêmes possibilités sur la plateforme."
        q4: "Combien coûte l'adhésion ?"
        a4: "Ce n'est pas encore fixé. Nous ne fixerons le prix qu'une fois le contenu des prestations arrêté — tout le reste serait de la devinette. Les personnes inscrites sur la liste d'attente connaîtront les prix en premier et pourront alors décider."
        q5: "Quand cela commence-t-il ?"
        a5: "Nous commençons avec un petit groupe d'établissements, afin de pouvoir consacrer à chacun le temps nécessaire. Dès que nous attribuerons les premiers rendez-vous, nous vous contacterons — dans l'ordre des inscriptions."
        q6: "Qui effectue la visite ?"
        a6: "Quelqu'un de notre équipe, accompagné de personnes qui dépendent elles-mêmes de l'accessibilité. C'est précisément ce qui fait la différence avec une simple liste de contrôle : vous apprenez non seulement si une norme est respectée, mais comment votre établissement s'utilise réellement."
    form:
        title: "Rejoindre la liste d'attente"
        subtitle: "Sans engagement et gratuit. Nous vous contactons dès le lancement."
        required: "Obligatoire"
        optional: "Facultatif"
        restaurant_name: "Nom du restaurant"
        contact_name: "Votre nom"
