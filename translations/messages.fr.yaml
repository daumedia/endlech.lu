    hero:
        eyebrow: "Ensemble"
        heading: "L'accessibilité devient visible quand beaucoup tirent dans le même sens."
        text: "Un restaurant seul peut supprimer sa marche. Pour que cela devienne une image de tout le Luxembourg, il faut des communes qui font recenser leur restauration, des entreprises qui cofinancent et des organisations qui décident avec nous de ce qui est mesuré."
    selector:
        title: "Qu’est-ce qui vous amène ?"
        subtitle: "Trois voies, trois rôles très différents."
        more: "En savoir plus"
        commune: "Vous voulez savoir à quel point la restauration de votre commune est réellement accessible."
        company: "Vous voulez soutenir l'accessibilité financièrement ou avec votre équipe."
        association: "Vous représentez des personnes en situation de handicap et voulez décider de ce qui est mesuré."
