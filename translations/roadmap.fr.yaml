item:
    roadmap_changelog:
        title: "Feuille de route et journal des modifications publics"
        reason: "Cette page elle-même. De l'extérieur, rien ne permettait de savoir si la plateforme était encore développée."
    reviews:
        title: "Avis et commentaires"
        reason: "Les visiteurs doivent pouvoir partager leur propre expérience d'un établissement, et pas seulement lire les caractéristiques relevées."
    map:
        title: "Vue cartographique"
        reason: "Les coordonnées de chaque établissement existent déjà. Il manque la carte qui montre ce qui se trouve à proximité."
    favourites:
        title: "Favoris"
        reason: "Retenir des établissements sans les rechercher à chaque fois — la première utilité d'un compte au-delà des propositions."
    ios_app:
        title: "Application iOS native"
        reason: "L'interface nécessaire existe depuis juin. L'intérêt d'une application dédiée dépend de la quantité de contenu réellement utile en déplacement."
    chat_widget:
        title: "Fenêtre de discussion"
        reason: "Un contact direct pour les questions qu'aucun formulaire ne couvre. Reste à décider qui répond, et sous quel délai."
    ai_filter:
        title: "Recherche assistée par IA"
        reason: "Une recherche qui répondrait à « en fauteuil, au calme, ouvert le midi ». Ce qu'elle doit savoir faire exactement n'est pas encore défini."
    android_and_logins:
        title: "Application Android, connexion Google et Apple"
        reason: "Noté parce que la demande a été formulée. Aucun des trois points n'est à ce jour justifié ni situé dans l'ordre des priorités."

shelved_item:
    passkey_conditional_ui:
        title: "Proposition de passkey dans le champ de connexion"
        reason: "Techniquement possible, mais notre bouton dédié remplit le même rôle sans source d'erreur supplémentaire."
    passkey_signup:
        title: "Créer un compte avec un passkey"
        reason: "Un compte exige une adresse e-mail confirmée. Sans elle, il n'y aurait aucun recours en cas de perte de l'appareil."
    passkey_api:
        title: "Passkeys dans l'interface pour applications"
        reason: "L'application se connecte avec un jeton. Une seconde voie de connexion n'y apporterait aucune protection supplémentaire."
    passkey_attestation:
        title: "Vérification de l'origine des passkeys"
        reason: "Exiger une attestation du fabricant de la clé exclurait des appareils sans que personne n'exploite ces informations."
    apple_splash:
        title: "Écrans de démarrage pour l'installation sur iPhone"
        reason: "Une douzaine de fichiers image par taille d'appareil pour un dixième de seconde d'écran blanc en moins."
    pull_to_refresh:
        title: "Tirer pour actualiser"
        reason: "La page se recharge à chaque appel. Ce geste reproduirait ce que le navigateur sait déjà faire."
    push_notifications:
        title: "Notifications push"
        reason: "Sans motif justifiant une interruption, une notification push n'est qu'une gêne. Là où il y a quelque chose à signaler, il y a un e-mail."
    mobile_audit:
        title: "Revue mobile unique de toutes les pages"
        reason: "Plutôt qu'une revue ponctuelle, chaque nouvelle page est contrôlée à 320 pixels. Cela tient plus longtemps."
