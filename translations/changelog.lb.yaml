# Ëffentleche Changelog (Feature 07). Kuck changelog.de.yaml fir d'Wiel vun der Domain.
meta_title: "Changelog – Endlech.lu"
meta_description: "Wat sech op Endlech.lu geännert huet — verständlech zesummegefaasst, no Joeren zortéiert."
eyebrow: "Wat sech geännert huet"
heading: "Changelog"
intro: "Wat op Endlech.lu dobäikomm ass — a verständlecher Sprooch, ouni Fachbegrëffer."

empty:
    title: "Nach keen Androen"
    body: "Hei steet nach näischt. Déi vollstänneg technesch Fassung gëtt et am Repository."

year_heading: "%year%"

summary:
    title: "Opbau vun der Plattform"
    period: "Januar bis Mäerz 2026"
    body: "An där Zäit ass Endlech.lu entstanen: Restaurantlëscht, Detailsäiten, Konten, Bezuelungsugaben, verifizéiert Lokaler an déi éischt Uginne fir Barrièrefräiheet. Déi eenzel Schrëtt si am Repository nozeliesen."

repo:
    section_title: "Vollstänneg Fassung"
    explainer: "Am Repository läit den techneschen Changelog: all Ausliwwerung, och déi reng intern, mat Fehlerbehiewungen, Datebankännerungen a Verweiser op de Quelltext. Hie gëtt fir Entwéckler geschriwwen an ass net kommentéiert."
    language_note: "Nëmmen op Däitsch verfügbar."
    link_label: "CHANGELOG.md op GitHub opmaachen"

release:
    v2026_08_31:
        title: "Roadmap a Changelog"
        body: "Zwee nei Säite weisen, wourun geschafft gëtt: D'Roadmap féiert an dräi Spalten op, wat an Aarbecht, geplangt an ugeduecht ass — a wat mir bewosst net bauen. De Changelog erzielt, wat sech zulescht geännert huet. Ouni Datumen, dofir mat enger Begrënnung zu all Virhuelen."
    v2026_08_30_2:
        title: "Ideeën-Board"
        body: "En ëffentlecht Board fir Virschléi zur Plattform: Ideeën araichen, friemen zoustëmmen, an zu all Idee steet, wat doraus ginn ass — och dann, wann d'Äntwert Neen ass."
    v2026_08_30:
        title: "Pressesäit an Neiegkeeten per E-Mail"
        body: "Eng Pressesäit mat fäerdege Beschreiwungstexter, aktuellen Zuelen a Logoen zum Eroflueden. Wien op enger vun de Waardelëschte steet, ka sech ausserdeem fir Neiegkeete per E-Mail androen."
    v2026_08_29:
        title: "Vergläichssäiten a Barrièrefräiheet"
        body: "Dräi Säiten, déi Endlech.lu oppe mat Google Maps, Wheelmap an TripAdvisor vergläichen — mat Quell a Préifdatum zu all Ausso. Dobäi eng vollstänneg Iwwerschaffung fir Tastatur, Screenreader a Kontrast an eng Säit, op deem de Stand vun der Barrièrefräiheet nozeliesen ass."
    v2026_08_09:
        title: "Kloer Äntwerten amplaz eidel Këschtercher"
        body: "Am Virschlagsformulaire ersetzen dräi Äntwerten — Jo, Neen, Weess net — déi fréier Hoken. En eidelt Këschtchen huet virdrun zweeërlee gläichzäiteg bedeit; bei Barrièrefräiheet ass den Ënnerscheed wesentlech."
    v2026_06_19:
        title: "Op den Home-Bildschierm derbäisetzen"
        body: "Endlech.lu léisst sech um iPhone wéi eng App installéieren: eege Symbol, Vollbild an eng Säit, déi och ouni Netz eppes weist. Ënne erschéngt eng Navigatiounsleescht a Fangerräichwäit."
    v2026_03_22:
        title: "Ëffnungszäiten, Kichen an Arrêten"
        body: "All Lokal kann méi Zäitfënstere pro Dag féieren, an d'Lëscht léisst sech op „elo op“ filteren. Dobäi Kichentypen zum Filteren an d'Arrêten an der Noperschaft."
    v2026_03_17:
        title: "Profil an eege Araichungen"
        body: "En eegene Profil mat Bild, Numm an der Lëscht vun de Lokaler, déi ee selwer agereecht huet. Restauranten kréien en Titelbild."
    v2026_03_08e:
        title: "Fotoen zu all Lokal"
        body: "Méi Fotoe pro Restaurant, vergréisserbar a mat enger Beschreiwung, déi och e Screenreader virliese kann."
    v2026_03_08d:
        title: "Filtere fir d'Restaurantlëscht"
        body: "D'Lëscht léisst sech no de Kritäre filteren, op déi et ukënnt: stufelosen Agang, barrièrefräi Toilette, Assistenzhënn a weiderer."
