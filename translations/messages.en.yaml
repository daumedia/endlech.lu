about:
    title: "About Endlech | Endlech.lu"
    heading: "About Endlech"
    subtitle: "The story behind Endlech.lu — a platform that was long overdue."
    founder: "Founder"
    founder_bio: "I'm Michael, 30 years old, and affected by SMA2 (Spinal Muscular Atrophy Type 2) since birth. As a passionate programmer and photographer, I know from personal experience how important true accessibility is in daily life — and that's exactly what drives me at Endlech.lu."
    tag_age: "30 years"
    tag_sma: "SMA2"
    tag_programmer: "Programmer"
    tag_photographer: "Photographer"
    story_title: "The Story of Endlech.lu"
    story_intro: "Endlech.lu was actually long overdue. I had the idea as a teenager — a place where people with limited mobility could easily find accessible restaurants in Luxembourg. Something that simply didn't exist in such a simple and clear way."
    timeline_2018_title: "Planning Begins"
    timeline_2018_text: "The idea matured into a concrete decision: I wanted to actually build the platform. In 2018, I began seriously planning the project."
    timeline_2020_title: "Active Development"
    timeline_2020_text: "Together with a friend and partner, I began actively building the platform. We shared the vision and worked on it with real enthusiasm."
    timeline_2022_title: "Involuntary Pause"
    timeline_2022_text: "Unfortunately, things didn't work out with my partner, and alone I simply didn't have the time. I had to reluctantly put the project on hold."
    timeline_2025_title: "Restart"
    timeline_2025_text: "At the end of 2025, I decided to start again — and see it through this time. With fresh energy and the right tech stack, I restarted the development from scratch."
    timeline_2026_date: "March 2026"
    timeline_2026_title: "First Live Version"
    timeline_2026_text: "In March 2026, Endlech.lu finally goes live — with real restaurant data, accessibility filters, community suggestions, and a full admin panel. The foundation is set, and the platform grows with every review."
    mission_title: "Our Mission"
    mission_text: "Accessibility shouldn't be a matter of chance. With Endlech.lu, we want to help people with limited mobility find restaurants in Luxembourg that are truly accessible — verified by the community, for the community."
    mission_cta: "Discover Restaurants"

legal:
    title: "Legal Notice – Endlech.lu"
    heading: "Legal Notice"
    info_title: "Information according to § 5 TMG / Art. 11 Loi sur le commerce électronique"
    info_text: "Endlech.lu\nLuxembourg"
    contact_title: "Contact"
    contact_email_label: "Email:"
    disclaimer_title: "Disclaimer"
    content_title: "Liability for Content"
    content_text: "The contents of our pages were created with the utmost care. However, we cannot guarantee the accuracy, completeness, and timeliness of the content."
    links_title: "Liability for Links"
    links_text: "Our website contains links to external third-party websites over whose content we have no influence. Therefore, we cannot accept any liability for this external content. The respective provider or operator of the pages is always responsible for the content of the linked pages."
    privacy_title: "Privacy"
    privacy_text: "The restaurant list, the detail pages and the open dataset can be used without an account and without providing personal data. Anyone who creates an account, suggests a restaurant or joins a waiting list deliberately provides data — which data and where it goes is set out in the sections below."
    error_tracking_title: "Error tracking (Sentry)"
    error_tracking_text: "To detect and fix technical errors, we use Sentry (Functional Software, Inc.). If an error occurs on our website, technical details such as the time, the page requested and the error message are transmitted to servers in the European Union (Frankfurt am Main). IP addresses and user data are not transmitted. The legal basis is our legitimate interest in the stable and secure operation of the website pursuant to Art. 6(1)(f) GDPR."
    mail_title: "Email delivery (Brevo)"
    mail_text: "We use Brevo (Sendinblue GmbH, Cologne) to send emails — confirmations, notifications, waiting lists. Transmitted are the recipient’s email address and name as well as the content of the message. The legal basis is Art. 6(1)(b) GDPR, or (a) for waiting list sign-ups. A data processing agreement is in place."
    transit_title: "Nearby stops (Verkéiersverbond)"
    transit_text: "On restaurant detail pages we show public transport stops. For this we query the Verkéiersverbond interface — only the restaurant’s coordinates are transmitted. No visitor data: neither IP address nor identifier. We cache the response for 24 hours."
    rights_title: "Your rights"
    rights_intro: "You have the right at any time to:"
    rights_access: "access the data stored about you (Art. 15 GDPR)"
    rights_erasure: "erasure of your account and the associated data (Art. 17 GDPR)"
    rights_portability: "portability — a machine-readable copy of your data (Art. 20 GDPR)"
    rights_withdraw: "withdraw your consent, for example to a waiting list sign-up (Art. 7(3) GDPR)"
    rights_complaint: "lodge a complaint with the Commission nationale pour la protection des données (CNPD), Luxembourg"
    rights_how: "Access, export and erasure you do yourself in your profile — immediately and without a request:"
    rights_profile_link: "go to my profile"
    retention_title: "Retention"
    retention_text: "Account data is kept while the account exists; after deletion it disappears immediately. Waiting list sign-ups remain until withdrawn or until the programme starts. Restaurant information stays permanently — it is factual data and is separated from the person after an account deletion."

criteria:
    score_title: "How the score is calculated"
    score_intro: "On the transparency page and in the open dataset, each restaurant carries a score from 0 to 10. It comes from eight equally weighted criteria:"
    score_wheelchair: "Step-free access"
    score_toilet: "Accessible toilet"
    score_dogs: "Assistance dogs welcome"
    score_lighting: "Good lighting"
    score_changing_table: "Changing table"
    score_parking: "Disabled parking space"
    score_door_width: "Door width at least 90 cm (DIN 18040)"
    score_table_spacing: "Table spacing at least 90 cm (DIN 18040)"
    score_unmeasured: "Important: what we have not recorded counts as not met. The score therefore measures documented accessibility — not actual accessibility. A restaurant we know nothing about gets 0 out of 10, even if everything is fine on site."
    score_where: "The current figures are on the transparency page:"
    score_open_link: "go to /open"
    title: "Accessibility Criteria – Endlech.lu"
    heading: "Accessibility Criteria"
    intro: "These criteria help us objectively assess restaurants for their accessibility. Each restaurant is evaluated based on the following points."
    entrance_title: "Accessible Entrance"
    entrance_text: "The entrance is accessible without steps or thresholds, or a ramp is available. Automatic or easy-to-open doors are a plus."
    parking_title: "Disabled Parking"
    parking_text: "A designated parking space for people with disabilities is available in close proximity to the entrance."
    toilet_title: "Accessible Toilet"
    toilet_text: "A wheelchair-accessible toilet with sufficient space, grab bars, and an accessible sink is available."
    interior_title: "Wheelchair-Friendly Interior"
    interior_text: "Sufficiently wide aisles (at least 90 cm), tables with wheelchair clearance, and enough space between seats allow independent navigation."
    staff_title: "Helpful Staff"
    staff_text: "Staff are aware and willing to actively support people with limitations — without being intrusive."
    menu_title: "Readable Menu"
    menu_text: "The menu is printed in a readable font size or available digitally. Braille or large print versions are an additional plus."
    note_label: "Note:"
    note_text: "The reviews on Endlech.lu are based on experiences from our community. Accessibility may vary depending on individual needs. We recommend contacting the restaurant directly before your visit."

