partner:
    meta_title: "Partner programme for restaurants"
    hero:
        eyebrow: "Partner programme"
        heading: "Your guest is at the door — and turns away again."
        text: "A step at the entrance, a doorway too narrow, a toilet down in the basement: for many people in Luxembourg, a restaurant visit ends before it begins. We help you find those barriers and remove them."
        cta: "Join the waiting list"
    benefits:
        title: "What you get as a partner"
        advisory_title: "Advisory report"
        advisory_text: "We come to you, look at your venue through your guests’ eyes and write down what works and what is worth changing. Concrete, sorted by effort, without jargon."
        box_title: "Inclusion Box"
        box_text: "Materials for everyday use on site: signage, stickers for the entrance and windows, table displays. So your guests know where they stand before they even walk in."
        visibility_title: "Visibility"
        visibility_text: "We tell the story of what you have changed — in our channels and on your profile. Not as advertising space, but as an example others can follow."
    integrity:
        badge: "Our promise"
        heading: "Ratings are not for sale."
        text: "We are an accessibility platform. If our ratings could be bought, they would be worthless — to your guests and to you. That is why, without exception:"
        point_1: "Listing, accessibility data and score are free and public, and stay that way — for every restaurant in Luxembourg, partner or not."
        point_2: "The verification badge depends solely on verified accessibility. Membership changes nothing about it."
        point_3: "Membership has no influence whatsoever on your rating, your position in search results or your visibility in filters."
    included:
        title: "What is included?"
        subtitle: "Everything to do with the rating is free. What you pay for is advice, materials and support."
        caption: "Comparison of free services with those of the partner membership"
        col_feature: "Service"
        col_free: "Free"
        col_partner: "Partner"
        row_listing: "Listing on Endlech.lu"
        row_score: "Accessibility data and score"
        row_badge: "Verification badge"
        row_search: "Visibility in search and filters"
        row_report: "On-site advisory report"
        row_box: "Inclusion Box with materials"
        row_guidance: "Support during implementation"
        row_funding: "Help with the funding application"
        row_plaque: "Partner plaque (informational only)"
        # Gequotet, weil YAML `yes`/`no` sonst als Boolean liest (wie bei tristate).
        "yes": "included"
        "no": "not included"
        pricing_note: "Prices and package scope are not final yet. Whoever is on the waiting list hears first — and can then decide without pressure."
    legal:
        title: "The legal framework"
        law: "The Luxembourg law of 7 January 2022 on the accessibility of places open to the public also applies to existing restaurants. For them, the deadline to comply runs until 1 January 2032."
        aid: "The state contributes: 50 % of the cost of works, studies and advice is covered, capped at €24,000 excl. VAT. Starting early means more choice of contractors and more time for the paperwork."
        link: "Information on guichet.public.lu"
        link_new_window: "(opens in a new window)"
        disclaimer_label: "Please note:"
        disclaimer: "This is general information, not legal advice. For your specific case, please contact the competent authorities or a legal adviser."
    how:
        title: "How it works"
        step1_title: "Join the waiting list"
        step1_text: "You sign up below and confirm your email address. That commits you to nothing and costs nothing."
        step2_title: "Visit and conversation"
        step2_text: "We get in touch, come by and look at your venue. This first visit is free — even if you say no afterwards."
        step3_title: "You decide"
        step3_text: "By then you know the effort, the cost and the funding options. Only after that do you decide whether a membership makes sense for you."
    faq:
        title: "Frequently asked questions"
        q1: "Does paying improve our score?"
        a1: "No. The score follows solely from the recorded accessibility features of your venue. There is no bonus, no preferential placement and no way to buy it. If you score better as a partner, it is because you changed something — not because you paid."
        q2: "What if we score badly?"
        a2: "Then that is the starting point, not the verdict. Almost every venue has places where things get stuck. The report shows you which of them can be fixed with little effort and which would mean larger building work. We do not publish a snapshot to put anyone on the spot."
        q3: "Is the verification really free?"
        a3: "Yes. Verification, listing and all accessibility data are free and will stay that way. They are our public purpose, not part of the offer. A restaurant that never becomes a partner has exactly the same opportunities on the platform."
        q4: "What does the membership cost?"
        a4: "That is not decided yet. We will only set the price once the scope of services is final — anything else would be guesswork. Whoever is on the waiting list hears the prices first and can then decide."
        q5: "When does it start?"
        a5: "We are starting with a small group of venues so we can give each of them enough time. As soon as we hand out the first appointments, we will contact you — in the order of registration."
        q6: "Who carries out the visit?"
        a6: "Someone from our team, together with people who rely on accessibility themselves. That is exactly what sets it apart from a mere checklist: you learn not only whether a standard is met, but how your venue actually works in practice."
