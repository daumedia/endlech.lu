    commune:
        title: "For municipalities"
        intro: "We survey the hospitality sector in your municipality on site — venue by venue, by the same criteria as everywhere else on Endlech.lu. In the end you know where your municipality stands, and your residents can see it too."
        scope_title: "What the survey covers"
        scope_1: "A visit to every participating venue, together with people who rely on accessibility themselves."
        scope_2: "Recording against the public criteria: entrance, toilet, lighting, assistance dogs, changing table, disabled parking."
        scope_3: "Photos and measurements wherever they matter for the assessment."
        scope_4: "Notes on which barriers can be removed with little effort and which are structural."
        deliverables_title: "What you receive"
        deliverable_1_title: "Public map"
        deliverable_1_text: "Every surveyed venue in your municipality on Endlech.lu — freely accessible to everyone."
        deliverable_2_title: "Written report"
        deliverable_2_text: "Prepared for the council: starting position, findings, recommended actions."
        deliverable_3_title: "Presentation"
        deliverable_3_text: "We present the results in person to the council or a committee."
        duration_title: "How long it takes"
        duration_text: "From commission to report takes eight to sixteen weeks, depending on the number of venues. We schedule the visits themselves into a few consecutive weeks, so the results stay comparable."
        no_guarantee_title: "You are paying for the survey, not for the outcome."
        no_guarantee_text: "This is not a formality but the heart of the matter: we do not promise that your municipality will score well. The figures are what they are, and they get published — even when they are uncomfortable. A result you could buy would be worthless to your residents."
        law_title: "The legal background"
        law_text: "The law of 7 January 2022 on the accessibility of places open to the public also applies to existing restaurants; for them the deadline runs until 1 January 2032. A survey shows you early how many businesses in your municipality are affected."
        law_disclaimer: "General information, not legal advice."
        pricing: "The price depends on the number of venues and is quoted individually. Tell us roughly how many businesses you have — you will get a concrete offer."
        cta: "Request a survey"
    company:
        title: "For companies"
        intro: "You can help fund accessibility in Luxembourg without receiving anything others do not. What you get is to be named as a supporter — no better rating, no preferential placement, no influence on content."
        formats_title: "Formats"
        format_1_title: "Fund Inclusion Boxes"
        format_1_text: "Materials for restaurants: signage, stickers, table displays. One box covers one venue."
        format_2_title: "Employees as test participants"
        format_2_text: "Your team joins surveys on site. That gives us hands and gives your people a perspective that is hard to convey from a desk."
        format_3_title: "Co-fund a municipality"
        format_3_text: "Not every municipality has a budget. You can cover the survey for a specific one."
        format_4_title: "Translations and workshops"
        format_4_text: "The platform exists in Luxembourgish, German, French and English. Translations and training for restaurateurs cost money that does not come from membership fees."
        exclusion_title: "Who we do not accept as a sponsor"
        exclusion_text: "So that our recommendations keep their worth, we take no money from companies that could benefit from those very recommendations:"
        exclusion_1: "Restaurant chains and businesses that are themselves rated on Endlech.lu."
        exclusion_2: "Firms that carry out accessibility conversions."
        exclusion_3: "Manufacturers and suppliers of products we might name in advisory reports."
        exclusion_reason: "This rule is published here so that we can be held to it. When in doubt, we decline."
        cta: "Enquire about sponsorship"
    association:
        title: "For organisations and associations"
        intro: "We measure accessibility — but who decides what gets measured and how much it counts? That is not a decision we want to make alone. This is what the advisory board is for."
        decides_title: "What the advisory board decides"
        decides_1: "Which criteria are recorded and how they are defined."
        decides_2: "How heavily each criterion counts towards the score."
        decides_3: "When a rating methodology changes — and how that is documented publicly."
        meetings_title: "How often"
        meetings_text: "Two fixed meetings a year, plus a written round if something comes up in between. Remote participation is possible."
        public_title: "Named publicly"
        public_text: "Advisory board members appear on the site with their organisation and name. Whoever helps decide the criteria should be identifiable."
        no_money_title: "No money changes hands in either direction."
        no_money_text: "The advisory board is neither sponsorship nor a client relationship. You pay nothing, and you receive no fee. That is exactly what makes the work credible: whoever helps set the criteria must not depend on them financially."
        cta: "Register interest in the advisory board"
    integrity:
        badge: "The same for all three"
        heading: "Ratings are not for sale."
        text: "Whether municipality, sponsor or advisory board member: nobody can influence the rating of a restaurant. That applies without exception and without discretion."
        point_1: "Accessibility data, scores and rankings are free, public and identical for all restaurants — regardless of whether anyone paid for the survey."
        point_2: "A municipality that commissions a survey gets the figures that come out of it. No business is favoured because the municipality pays."
        point_3: "Sponsors and advisory board members have no access to individual ratings and cannot have an entry changed."
    form:
        title: "Send an enquiry"
        subtitle: "Without obligation. We will get in touch and sort out the rest in conversation."
        type: "Who is this about?"
        type_changed: "Form switched to %type%. The fields below have changed."
        organisation_name: "Name of the organisation"
        contact_name: "Your name"
        contact_role: "Your role"
        contact_role_help: "For example alderman, CSR manager or board member."
        email: "Email address"
        phone: "Phone"
        website: "Website"
        message: "Your message"
        honeypot: "Company website"
        block_commune: "About the municipality"
        block_company: "Sponsorship interests"
        block_association: "Forms of collaboration"
        commune_name: "Municipality"
        commune_name_help: "If it differs from the name of the organisation, for example in a syndicate."
        estimated_venues: "Number of venues"
        estimated_venues_help: "A rough estimate is enough — restaurants, cafés and bars combined."
        timeframe: "Timeframe"
        timeframe_placeholder: "Please choose"
        commune_forwarding_note: "Please note: for the on-site survey we work with a collaborator. Your enquiry may be passed on to them internally for this purpose."
        sponsorship_interests: "What would be of interest to you?"
        collaboration_interests: "What would you be interested in?"
        association_no_money: "As a reminder: you pay nothing for any of these, and you receive no fee."
        consent: "I agree that Endlech.lu may store my details and contact me about my enquiry."
        privacy_note: "Your data is used solely for this enquiry. You can withdraw your consent at any time. More on this in our"
        privacy_link: "privacy policy"
        submit: "Send enquiry"
        error_summary: "Please check your details — %count% field(s) still need attention."
    success:
        commune_title: "Your enquiry has arrived."
        commune_text: "We have sent an email to %email%. Please confirm the link in it. After that we will get in touch with a proposed date and an estimate of how long the survey will take for your number of venues."
        company_title: "Thank you for your interest."
        company_text: "We have sent an email to %email%. Please confirm the link in it. After that we will briefly check the exclusion criteria and get back to you."
        association_title: "Thank you for wanting to think along with us."
        association_text: "We have sent an email to %email%. Please confirm the link in it. After that we will tell you how the advisory board works and when the next meeting is due."
        default_title: "Your enquiry has arrived."
        default_text: "We have sent you an email. Please click the link in it to confirm your enquiry."
