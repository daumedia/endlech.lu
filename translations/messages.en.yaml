open:
    title: "Numbers & finances"
    eyebrow: "Open Startup"
    heading: "How Endlech.lu is doing"
    intro: "We ask restaurants to be open about how accessible they are. We hold ourselves to the same standard: how many venues are listed, how many we have checked in person, what running the platform costs and where the money comes from. Platform and impact figures come straight from the database; the finances we maintain by hand each month."
    link_json: "Figures as JSON"
    link_dataset: "Download dataset"
    hero:
        lead: "Restaurants on the platform"
        lead_context: "%verified% of them checked on site by the team · %communes% communes across %cantons% cantons"
    delta:
        since: "since %month%"
        unchanged: "unchanged since %month%"
    platform:
        unscored: "not yet assessed"
        unscored_hint: "Venues we have no information about at all. They get no score — a zero would mean “none of this is there”, and nobody claimed that."
        distribution_unscored: "%count% venues without information are not included."
        heading: "The platform"
        intro: "All figures are computed live from the database and refreshed hourly."
        restaurants: "Restaurants"
        verified: "Checked by the team"
        verified_hint: "%share% % of all entries"
        communes: "Communes"
        communes_hint: "%share% % of the country"
        canton: "Canton"
        canton_communes: "Communes"
        score: "Avg. score"
        score_hint: "Average across %scored% assessed venues. Eight equally weighted criteria; what is not recorded counts as not met."
        distribution_heading: "Score distribution"
        distribution_intro: "How many restaurants meet how many of the eight accessibility criteria. Measurements that were never taken count as not met – the figure measures documented accessibility, not assumed accessibility."
        distribution_row: "%score% of %max%"
        distribution_axis: "Score from 0 to %max%"
        distribution_table: "Show figures as a table"
        share: "Share"
        canton_heading: "Coverage by canton"
        canton_intro: "All twelve cantons are listed, including those without a single entry. The blank spots are the more honest half of the picture."
        unassigned_one: "One entry cannot be matched to a commune because the place is recorded in a spelling we do not know. It is missing from the canton breakdown but still counted in the total."
        unassigned_other: "%count% entries cannot be matched to a commune because the place is recorded in a spelling we do not know. They are missing from the canton breakdown but still counted in the total."
    impact:
        heading: "What it achieves"
        intro: "Documented facts – no estimates, no extrapolation."
        step_free: "Step-free entrances"
        restrooms: "Accessible restrooms"
        assistance_dogs: "Assistance dogs welcome"
        wide_doors: "Doors from %min% cm"
        table_spacing: "Table spacing from %min% cm"
        inclusion_boxes: "Inclusion Boxes delivered"
        inclusion_boxes_hint: "From the material receipts"
        of_total: "of %total% restaurants"
        of_measured: "of %measured% measured"
        footnote: "Door widths and table spacing exist only where someone actually took a tape measure. That is why these two figures are given against the number of measured venues rather than the total."
    finance:
