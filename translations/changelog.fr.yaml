# Journal des modifications public (Feature 07). Voir changelog.de.yaml pour le domaine.
meta_title: "Journal des modifications – Endlech.lu"
meta_description: "Ce qui a changé sur Endlech.lu — résumé en langage clair, classé par année."
eyebrow: "Ce qui a changé"
heading: "Journal des modifications"
intro: "Ce qui s'est ajouté sur Endlech.lu — en langage clair, sans jargon technique."

empty:
    title: "Aucune entrée pour l'instant"
    body: "Il n'y a encore rien ici. La version technique complète se trouve dans le dépôt."

year_heading: "%year%"

summary:
    title: "Construction de la plateforme"
    period: "De janvier à mars 2026"
    body: "C'est la période où Endlech.lu a vu le jour : liste des restaurants, fiches détaillées, comptes, moyens de paiement, établissements vérifiés et les premières indications d'accessibilité. Le détail des étapes est consultable dans le dépôt."

repo:
    section_title: "Version complète"
    explainer: "Le dépôt contient le journal technique : chaque mise en production, y compris purement interne, avec les corrections de bogues, les modifications de base de données et les renvois au code source. Il est écrit pour des développeurs et n'est pas commenté."
    language_note: "Disponible uniquement en allemand."
    link_label: "Ouvrir CHANGELOG.md sur GitHub"

release:
    v2026_09_15:
        title: "Endlech.lu existe désormais en portugais"
        body: "Tout le site est désormais disponible en portugais – pour les nombreuses personnes au Luxembourg qui parlent portugais. Vous le choisissez en haut, dans le sélecteur de langue. Le pied de page a également été réorganisé : les liens sont regroupés sous des intitulés, et les mentions légales, la protection des données et l’accessibilité figurent sur une ligne à part. Enfin, qui souhaite proposer un restaurant voit d’abord comment cela se déroule et pourquoi un compte gratuit est nécessaire, au lieu de tomber directement sur la page de connexion."
    v2026_09_14_2:
        title: "Nous mesurons désormais ce qui est lu — sans cookies"
        body: "Pour savoir quelles pages sont utiles et où la recherche s’interrompt, nous comptons les pages vues et quelques étapes comme « filtre appliqué ». Cela tourne sur notre propre serveur : pas de cookies, pas d’adresse IP conservée, rien qui soit lié à un compte. Si vous ne souhaitez pas être compté·e, désactivez-le dans la politique de confidentialité — ou envoyez « Do Not Track » ou « Global Privacy Control » depuis votre navigateur."
    v2026_09_12_1:
        title: "Une typographie qui nous appartient"
        body: "Endlech.lu a désormais sa propre typographie. Jusqu’à présent, chaque appareil affichait le site avec la police qu’il avait sous la main ; il a maintenant la même apparence partout. La police est hébergée sur notre propre serveur : aucune requête n’est adressée à un tiers et aucune information vous concernant n’est transmise. Nous avons également corrigé un défaut qui permettait de faire glisser la page latéralement sur les tablettes et dans les fenêtres étroites, alors qu’il n’y avait rien à faire glisser. Et les personnes qui utilisent un lecteur d’écran trouveront les sections dans un ordre sans rupture."
    v2026_09_12:
        title: "Compte et mot de passe mieux protégés"
        body: "Supprimer votre compte exige votre mot de passe — et cette saisie ne peut plus être répétée indéfiniment. Après trois tentatives infructueuses, une pause de 15 minutes s’applique. Il en va de même pour « mot de passe oublié » : la page ne révèle plus si une adresse correspond à un compte."
    v2026_09_11_2:
        title: "Les adresses avec accents fonctionnent"
        body: "Si votre adresse e-mail comporte un accent ou un tréma dans le domaine — par exemple sur télécom.lu ou bäckerei.lu —, vous ne pouviez jusqu’ici ni créer un compte ni vous inscrire sur une liste d’attente : le formulaire la refusait. C’est corrigé. Dans le même temps, les formulaires vérifient plus rigoureusement, afin qu’une adresse non distribuable ne soit plus acceptée."
    v2026_09_11:
        title: "Qui exploite Endlech.lu"
        body: "Endlech.lu est désormais exploité par une société inscrite, DAUMEDIA S.à r.l.-S, et non plus par une personne privée. Les mentions légales indiquent donc à présent le siège, le numéro du registre de commerce et l’autorisation d’établissement. Pour vos données, cela signifie que vos droits d’accès, de rectification et d’effacement s’exercent désormais auprès de la société. Ce qui change, c’est qui est responsable — pas ce que nous conservons à votre sujet."
    v2026_09_05:
        title: "La liste d’attente pour l’application"
        body: "Endlech.lu arrive sur votre téléphone. Une version de test tourne déjà pour iPhone et iPad — inscrivez-vous et vous recevrez l’accès par e-mail. Pour Android, rien n’a encore été développé, et nous le disons franchement : votre inscription compte au moment de décider si nous commençons."
    v2026_08_31:
        title: "Feuille de route et journal des modifications"
        body: "Deux nouvelles pages montrent ce sur quoi nous travaillons : la feuille de route présente en trois colonnes ce qui est en cours, prévu et à l'étude — ainsi que ce que nous ne construisons délibérément pas. Le journal raconte ce qui a changé récemment. Sans dates, mais avec une justification pour chaque point."
    v2026_08_30_2:
        title: "Tableau d'idées"
        body: "Un tableau public pour les propositions concernant la plateforme : proposer une idée, soutenir celle d'un autre, et pour chaque idée, ce qu'elle est devenue — y compris lorsque la réponse est non."
    v2026_08_30:
        title: "Page presse et actualités par e-mail"
        body: "Une page presse avec des textes de présentation prêts à l'emploi, des chiffres actuels et des logos à télécharger. Les personnes inscrites sur une liste d'attente peuvent en outre recevoir les actualités par e-mail."
    v2026_08_29:
        title: "Pages de comparaison et accessibilité"
        body: "Trois pages qui comparent ouvertement Endlech.lu à Google Maps, Wheelmap et TripAdvisor — chaque affirmation avec sa source et sa date de vérification. S'y ajoutent une refonte complète pour le clavier, les lecteurs d'écran et le contraste, ainsi qu'une page exposant l'état de l'accessibilité."
    v2026_08_09:
        title: "Des réponses claires plutôt que des cases vides"
        body: "Dans le formulaire de proposition, trois réponses — oui, non, je ne sais pas — remplacent les anciennes cases à cocher. Une case vide signifiait auparavant deux choses à la fois ; en matière d'accessibilité, la différence est essentielle."
    v2026_06_19:
        title: "Ajouter à l'écran d'accueil"
        body: "Endlech.lu s'installe sur iPhone comme une application : icône dédiée, plein écran et une page qui affiche encore quelque chose sans réseau. Une barre de navigation apparaît en bas, à portée de pouce."
    v2026_03_22:
        title: "Horaires, cuisine et arrêts de transport"
        body: "Chaque établissement peut avoir plusieurs plages horaires par jour, et la liste se filtre sur « ouvert maintenant ». S'y ajoutent les types de cuisine comme filtre et les arrêts à proximité."
    v2026_03_17:
        title: "Profil et propositions personnelles"
        body: "Un profil personnel avec photo, nom et la liste des établissements que l'on a soi-même proposés. Les restaurants reçoivent une photo de couverture."
    v2026_03_08e:
        title: "Photos pour chaque établissement"
        body: "Plusieurs photos par restaurant, agrandissables et accompagnées d'une description qu'un lecteur d'écran peut restituer."
    v2026_03_08d:
        title: "Filtres pour la liste des restaurants"
        body: "La liste se filtre selon les critères qui comptent : entrée de plain-pied, toilettes accessibles, chiens d'assistance et d'autres encore."
