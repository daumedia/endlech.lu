# Public changelog (Feature 07). See changelog.de.yaml for why this is its own domain.
meta_title: "Changelog – Endlech.lu"
meta_description: "What has changed on Endlech.lu — summarised in plain language, grouped by year."
eyebrow: "What has changed"
heading: "Changelog"
intro: "What has been added to Endlech.lu — in plain language, without technical terms."

empty:
    title: "No entries yet"
    body: "There is nothing here yet. The full technical version is in the repository."

year_heading: "%year%"

summary:
    title: "Building the platform"
    period: "January to March 2026"
    body: "This is when Endlech.lu came into being: restaurant list, detail pages, accounts, payment details, verified venues and the first accessibility information. The individual steps can be read in the repository."

repo:
    section_title: "Full version"
    explainer: "The repository holds the technical changelog: every release, including purely internal ones, with bug fixes, database changes and references to the source code. It is written for developers and is not annotated."
    language_note: "Available in German only."
    link_label: "Open CHANGELOG.md on GitHub"

release:
    v2026_09_14_2:
        title: "We now measure what gets read — without cookies"
        body: "To see which pages help and where searches are abandoned, we count page views and a few steps such as “filter applied”. It runs on our own server: no cookies, no stored IP address, nothing linked to an account. If you would rather not be counted, switch it off in the privacy policy — or send “Do Not Track” or “Global Privacy Control” from your browser."
    v2026_09_12_1:
        title: "A typeface of our own"
        body: "Endlech.lu now has its own typeface. Until today every device showed the site in whatever font it happened to have; now it looks the same everywhere. The font sits on our own server — no request goes to a third party, and nothing about you is sent along. We also fixed a defect that let the page be dragged sideways on tablets and in narrow windows, with nothing there to drag. And anyone reading with a screen reader will find the sections in unbroken order."
    v2026_09_12:
        title: "Better protection for account and password"
        body: "Deleting your account requires your password — and that entry can no longer be repeated indefinitely. After three failed attempts there is a 15-minute pause. The same applies to “forgot password”: the page no longer reveals whether an address has an account."
    v2026_09_11_2:
        title: "Addresses with accents now work"
        body: "If your email address has an accent or umlaut in the domain — say on télécom.lu or bäckerei.lu — you previously could not register or join a waiting list: the form rejected it. That is fixed. At the same time the forms check more thoroughly, so an undeliverable address is no longer accepted in the first place."
    v2026_09_11:
        title: "Who runs Endlech.lu"
        body: "Endlech.lu is now run by a registered company, DAUMEDIA S.à r.l.-S, rather than a private individual. The legal notice therefore now shows the registered office, the trade register number and the business licence. For your data this means your rights to access, correction and deletion are now addressed to the company. What changed is who is responsible — not what we store about you."
    v2026_09_05:
        title: "The app waiting list"
        body: "Endlech.lu is coming to your phone. A test build is already running for iPhone and iPad — sign up and you get access by email. For Android nothing has been built yet, and we say so plainly: your entry counts when we decide whether to start."
    v2026_08_31:
        title: "Roadmap and changelog"
        body: "Two new pages show what is being worked on: the roadmap lists in three columns what is in progress, planned and under consideration — and what we deliberately will not build. The changelog tells what has changed most recently. No dates, but a reason for every item."
    v2026_08_30_2:
        title: "Idea board"
        body: "A public board for suggestions about the platform: submit an idea, support someone else's, and for every idea, what became of it — including when the answer is no."
    v2026_08_30:
        title: "Press page and news by email"
        body: "A press page with ready-made description texts, current figures and logos to download. Anyone on one of the waiting lists can also sign up for news by email."
    v2026_08_29:
        title: "Comparison pages and accessibility"
        body: "Three pages comparing Endlech.lu openly with Google Maps, Wheelmap and TripAdvisor — every claim with its source and the date it was checked. Plus a complete overhaul for keyboard, screen readers and contrast, and a page setting out the state of accessibility."
    v2026_08_09:
        title: "Clear answers instead of empty boxes"
        body: "In the suggestion form, three answers — yes, no, don't know — replace the earlier checkboxes. An empty box used to mean two things at once; for accessibility that difference matters."
    v2026_06_19:
        title: "Add to home screen"
        body: "Endlech.lu installs on an iPhone like an app: its own icon, full screen and a page that still shows something without a network. A navigation bar appears at the bottom, within thumb's reach."
    v2026_03_22:
        title: "Opening hours, cuisine and nearby stops"
        body: "Every venue can have several time slots per day, and the list can be filtered to “open now”. Cuisine types were added as a filter, along with the nearby public transport stops."
    v2026_03_17:
        title: "Profile and your own submissions"
        body: "A personal profile with picture, name and the list of venues you submitted yourself. Restaurants get a cover photo."
    v2026_03_08e:
        title: "Photos for every venue"
        body: "Several photos per restaurant, enlargeable and with a description a screen reader can read out."
    v2026_03_08d:
        title: "Filters for the restaurant list"
        body: "The list can be filtered by the things that matter: step-free entrance, accessible toilet, assistance dogs and more."
