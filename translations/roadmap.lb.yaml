item:
    roadmap_changelog:
        title: "Ëffentlech Roadmap a Changelog"
        reason: "Dës Säit selwer. Vun dobaussen war bis elo net z'erkennen, ob nach un der Plattform geschafft gëtt."
    reviews:
        title: "Bewäertungen a Kommentaren"
        reason: "Gäscht sollen hir eegen Erfarung zu engem Lokal hannerloosse kënnen, net nëmmen déi erfaassten Ugaben liesen."
    map:
        title: "Kaartenusiicht"
        reason: "D'Koordinate leien un all Lokal scho vir. Et feelt d'Kaart, déi weist, wat an der Noperschaft ass."
    favourites:
        title: "Favoritten"
        reason: "Lokaler markéieren, ouni se all Kéier nei ze sichen — den éischten Notzen vun engem Kont iwwer d'Araiche eraus."
    ios_app:
        title: "Native iOS-App"
        reason: "D'Schnëttplaz dofir steet zënter Juni. Ob eng eege App sech lount, hänkt dovun of, ob et genuch Inhalt gëtt, deen ee ënnerwee brauch."
    chat_widget:
        title: "Chat-Fënster"
        reason: "En direkten Draht fir Froen, déi kee Formulaire ofdeckt. Virdru muss gekläert ginn, wien äntwert a wéi séier."
    ai_filter:
        title: "KI-ënnerstëtzt Sich"
        reason: "Eng Sich, déi op „mam Rollstull, roueg, mëttes op“ äntwert. Wat si genee kënne soll, ass nach net festgeluecht."
    android_and_logins:
        title: "Android-App, Google- an Apple-Umeldung"
        reason: "Notéiert, well dono gefrot gouf. Keen vun den dräi Punkten ass bis elo begrënnt oder agerangéiert."

shelved_item:
    passkey_conditional_ui:
        title: "Passkey-Virschlag am Umeldefeld"
        reason: "Technesch méiglech, mä den eegene Passkey-Knapp erfëllt dee selwechten Zweck ouni zousätzlech Feelerquell."
    passkey_signup:
        title: "Kont mat engem Passkey uleeën"
        reason: "E Kont brauch eng bestätegt E-Mail-Adress. Ouni si gëtt et kee Wee zréck, wann d'Apparat verluer geet."
    passkey_api:
        title: "Passkeys an der Schnëttplaz fir Apps"
        reason: "D'App mellt sech mat engem Token un. En zweeten Umeldewee bréngt do kee zousätzleche Schutz."
    passkey_attestation:
        title: "Hierkonftspréifung vu Passkeys"
        reason: "En Nowäis iwwer den Hiersteller vum Sécherheetsschlëssel géif Apparater aussperren, ouni datt een d'Ugaben auswäert."
    apple_splash:
        title: "Startbildschirmer fir d'iPhone-Installatioun"
        reason: "En Dutzend Bilddateien pro Apparategréisst fir een Zéngtel Sekonn manner wäisse Bildschierm."
    pull_to_refresh:
        title: "Zéien fir ze aktualiséieren"
        reason: "D'Säit lued bei all Opruff nei. D'Geste géif nobauen, wat de Browser schonn ka."
    push_notifications:
        title: "Push-Noriichten"
        reason: "Ouni en Uleies, dat eng Ënnerbriechung rechtfäerdegt, ass eng Push-Noriicht nëmmen eng Stéierung. Wou eppes ze mellen ass, gëtt et eng E-Mail."
    mobile_audit:
        title: "Eemoleg Mobil-Duerchsiicht vun alle Säiten"
        reason: "Amplaz vun enger eemoleger Duerchsiicht gëtt all nei Säit bei 320 Pixel gepréift. Dat hält méi laang."
