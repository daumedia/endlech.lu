# Öffentliche Roadmap (Feature 07). Eigene Domain, weil die Seite ihre Schlüssel
# datengetrieben aufruft (Vorhaben, Spalten, zurückgestellte Punkte) — der Scanner
# in CatalogueCompletenessTest sieht nur literale Schlüssel und liefe hier ins
# Leere. Die Lücke schließt RoadmapCatalogueTest.
#
# Diese Domain trägt auch den Aktualitätshinweis, den sich beide Seiten des
# Features teilen — er steht auf /roadmap und auf /changelog.
