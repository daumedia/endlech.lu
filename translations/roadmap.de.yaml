item:
    roadmap_changelog:
        title: "Öffentliche Roadmap und Changelog"
        reason: "Diese Seite selbst. Von außen war bisher nicht erkennbar, ob an der Plattform noch gearbeitet wird."
    reviews:
        title: "Bewertungen und Kommentare"
        reason: "Gäste sollen ihre eigene Erfahrung zu einem Lokal hinterlassen können, nicht nur die erfassten Merkmale lesen."
    map:
        title: "Kartenansicht"
        reason: "Die Koordinaten liegen an jedem Lokal bereits vor. Es fehlt die Karte, die zeigt, was in der Nähe ist."
    favourites:
        title: "Favoriten"
        reason: "Lokale merken, ohne sie jedes Mal neu zu suchen — der erste Nutzen eines Kontos über das Einreichen hinaus."
    ios_app:
        title: "Native iOS-App"
        reason: "Die Schnittstelle dafür steht seit Juni. Ob eine eigene App sich lohnt, hängt daran, ob es genug Inhalt gibt, den man unterwegs braucht."
    chat_widget:
        title: "Chat-Fenster"
        reason: "Ein direkter Draht für Fragen, die kein Formular abdeckt. Vorher ist zu klären, wer antwortet und wie schnell."
    ai_filter:
        title: "KI-gestützte Suche"
        reason: "Eine Suche, die auf „mit Rollstuhl, ruhig, mittags offen“ antwortet. Was genau sie können soll, ist noch nicht festgelegt."
    android_and_logins:
        title: "Android-App, Google- und Apple-Anmeldung"
        reason: "Notiert, weil danach gefragt wurde. Keiner der drei Punkte ist bisher begründet oder eingeordnet."

shelved_item:
    passkey_conditional_ui:
        title: "Passkey-Vorschlag im Anmeldefeld"
        reason: "Technisch möglich, aber der eigene Passkey-Knopf erfüllt denselben Zweck ohne zusätzliche Fehlerquelle."
    passkey_signup:
        title: "Konto per Passkey anlegen"
        reason: "Ein Konto braucht eine bestätigte E-Mail-Adresse. Ohne sie gäbe es keinen Weg zurück, wenn das Gerät verloren geht."
    passkey_api:
        title: "Passkeys in der Schnittstelle für Apps"
        reason: "Die App meldet sich mit einem Token an. Ein zweiter Anmeldeweg brächte dort keinen zusätzlichen Schutz."
    passkey_attestation:
        title: "Herkunftsprüfung von Passkeys"
        reason: "Ein Nachweis über den Hersteller des Sicherheitsschlüssels würde Geräte aussperren, ohne dass jemand die Angaben auswertet."
    apple_splash:
        title: "Startbildschirme für die iPhone-Installation"
        reason: "Ein Dutzend Bilddateien je Gerätegröße für eine Zehntelsekunde weniger weißen Bildschirm."
    pull_to_refresh:
        title: "Ziehen zum Aktualisieren"
        reason: "Die Seite lädt bei jedem Aufruf neu. Die Geste würde nachbauen, was der Browser bereits kann."
    push_notifications:
        title: "Push-Nachrichten"
        reason: "Ohne einen Anlass, der eine Unterbrechung rechtfertigt, ist eine Push-Nachricht nur eine Störung. Wo etwas zu melden ist, gibt es eine E-Mail."
    mobile_audit:
        title: "Einmalige Mobil-Durchsicht aller Seiten"
        reason: "Statt einer einmaligen Durchsicht wird jede neue Seite bei 320 Pixeln geprüft. Das hält länger."
