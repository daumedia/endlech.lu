# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

    # Wird im Footer als `v{{ app_version }}` gerendert (twig.yaml → globals).
    # Bei jedem Release mitziehen – zusammen mit den Badges in CHANGELOG.md und README.md.
    app.version: '2026.09.05'
    # string:-Cast, damit ein leerer/fehlender Key zu '' (nicht null) wird – sonst
    # bricht PublicTransportService (string $apiKey) bei der Graceful-Degradation.
    app.mobiliteit_api_key: '%env(string:default::MOBILITEIT_API_KEY)%'
    # 1000 statt 500: Beim alten Wert lieferte die Schnittstelle für 8 von 11
    # Restaurants null Haltestellen — an denselben Koordinaten sind es bei 2000
    # sieben (QA B10, BF-46). 1000 m entspricht etwa zwölf Minuten Fußweg und
    # bleibt damit eine Angabe, die jemand tatsächlich nutzen kann.
    app.mobiliteit_radius: 1000
    app.mobiliteit_max_stops: 5
    # TestFlight-Beta der iOS-App (Feature 08). string:-Cast wie beim
    # Mobiliteit-Schlüssel: ein fehlender Wert wird '' und nicht null, sonst
    # bräuchte jede Vorlage eine zweite Fallunterscheidung.
    #
    # ⚠ Leer heißt lautlos aus: Die Mail nach der Bestätigung geht dann ohne
    # Beta-Abschnitt hinaus (AK-24) – kein toter Knopf und keine leere Adresse.
    # Der echte Link gehört in .env.local und auf den Server, NICHT hierher.
    # Er steht bewusst nicht im Übersetzungskatalog: dort wären es vier Stellen.
    app.testflight_url: '%env(string:default::APP_TESTFLIGHT_URL)%'
    # Empfänger interner Benachrichtigungen (Partner-Warteliste).
    # Fallback-Parameter statt leerem Default: eine leere Empfängeradresse
    # ließe Symfony\Component\Mime\Address beim Versand werfen.
    app.contact_email: '%env(string:default:app.contact_email_fallback:CONTACT_EMAIL)%'
    app.contact_email_fallback: 'info@endlech.lu'

    # --- Betreiberangaben (Impressum /legal und Faktenblatt /presse) ---
    #
    # Seit dem 2026-09-05: **DAUMEDIA S.A.R.L.-S**, eingetragen im RCS Luxembourg
    # unter B311765 (Gründung 27.07.2026, Eintragung 02.09.2026). Betreiber ist
    # damit die Gesellschaft, nicht mehr die Privatperson — das gilt auch
    # datenschutzrechtlich: Verantwortlicher nach Art. 4 Nr. 7 DSGVO ist ab
    # sofort die S.à r.l.-S.
    #
    # ⚠ **`app.operator_address` ist jetzt gefüllt** — die frühere Entscheidung,
    # keine Anschrift zu veröffentlichen (VB-03/OF-04, 2026-08-30), ist damit
    # überholt: Art. 5 der luxemburgischen Loi du 14 août 2000 relative au
    # commerce électronique verlangt die geografische Anschrift, und der Sitz
    # steht im RCS ohnehin öffentlich. ⚠ Sitz und Wohnsitz des Geschäftsführers
    # sind dieselbe Adresse — bei einer S.à r.l.-S der Regelfall, aber wer sie
    # ändert, ändert damit eine Privatanschrift.
    #
    # ⚠ **`app.operator_vat` ist leer, bis die Nummer vorliegt.** Art. 5 verlangt
    # sie nur, „falls vorhanden"; die Gründungsurkunde nennt keine. Sobald das
    # Steueramt sie vergeben hat, hier eintragen — das Template blendet die Zeile
    # dann von selbst ein.
    #
    # Die Werte erscheinen an zwei Stellen zugleich — Faktenblatt auf /presse und
    # Impressum (/legal). Genau deshalb stehen sie hier und nicht in vier
    # Übersetzungskatalogen: Vier Stellen wären vier Gelegenheiten, eine Änderung
    # zu vergessen, und `CatalogueCompletenessTest` prüft Vollständigkeit, nicht
    # Gleichheit (AK-15).
    app.operator_name: 'DAUMEDIA S.A.R.L.-S'
    app.operator_address: "13, rue de la Fontaine\nL-3768 Tétange\nLuxemburg"
    app.operator_responsible: 'Michael Ferreira Rodrigues'
    # Handelsregister und Ermächtigung — Art. 5 der Loi du 14 août 2000 verlangt
    # beide ausdrücklich, die Ermächtigung samt der Behörde, die sie erteilt hat.
    app.operator_rcs: 'B311765'
    app.operator_authorisation: '10199120/0'
    app.operator_vat: ''
    # Presseadresse. ⚠ VB-02: Das Postfach muss beim Hoster eingerichtet sein und
    # gelesen werden — eine Presseadresse, die ins Leere läuft, ist schlimmer als
    # keine. Fallback-Parameter wie bei app.contact_email, damit ein leerer
    # Umgebungswert nicht zu einem `mailto:` ohne Adresse wird.
    app.press_email: '%env(string:default:app.press_email_fallback:PRESS_EMAIL)%'
    app.press_email_fallback: 'support@endlech.lu'

    # --- Brevo · Marketing-Kontakte (Feature 04) ---
    # string:-Cast wie bei app.mobiliteit_api_key: ein fehlender oder leerer Wert wird
    # zu '' statt null. Der Sync-Dienst prüft auf den leeren String und bleibt still
    # aus (AK-47), statt an einem typisierten Konstruktor zu scheitern.
    app.brevo_api_key: '%env(string:default::BREVO_API_KEY)%'
    # ⚠ Bewusst string: und NICHT int: – der int:-Prozessor wirft bei einem leeren Wert
    # („Non-numeric env var"), und genau das sprengte den Container-Build im Regelfall
    # „Funktion aus". Die Umwandlung nach int gehört in den Sync-Dienst, der ohnehin
    # prüfen muss, ob eine Liste konfiguriert ist. Leer = keine Listenzuordnung.
    app.brevo_list_id: '%env(string:default::BREVO_LIST_ID)%'
    # Bearer-Geheimnis des Webhooks. Leer = der Webhook nimmt nichts an (AK-46).
    app.brevo_webhook_token: '%env(string:default::BREVO_WEBHOOK_TOKEN)%'
    # Deckel und Mindestabstand des Sync-Laufs (Entwurf, „Missbrauchsschutz"): höchstens
    # 200 Kontakte je Lauf, mindestens 200 ms zwischen zwei Aufrufen an Brevo. Was nicht
    # hineinpasst, bleibt im Auftragsbuch und geht beim nächsten Lauf hinaus.
    app.brevo_sync_batch: 200
    app.brevo_sync_delay_ms: 200

    # --- Barrierefreiheitserklärung (Feature 02) ---
    # Die Werte stammen aus dem Prüflauf (Konformitäts-Prüfmatrix, docs/).
    # Bis zur ersten Prüfung ist tested_on leer → die Seite weist den Stand als
    # ausstehend aus (EC-07), statt einen Grad zu behaupten. Die Erklärung tritt
    # als freiwillige Selbstverpflichtung auf (AK-47) und nennt keine gesetzliche
    # Beschwerdestelle (AK-43). known_issues ist die Liste nicht zugänglicher
    # Inhalte (je Eintrag: criterion, reason, planned).
    app.accessibility.conformance_level: 'partial'   # none | partial | full — teilweise konform (Prüfung 2026-08-26)
    app.accessibility.tested_on: '2026-08-26'        # axe-core (WCAG 2.2 AA) über alle Seiten + Browser-Interaktion (Fokus, Kontrastmodus, Tastatur)
    app.accessibility.review_interval_months: 12     # Veralterungshinweis ab hier (AK-46)
    # Nicht (vollständig) zugängliche Inhalte mit Begründung (AK-45). Kriterium/Grund/Datum.
    app.accessibility.known_issues:
        - criterion: 'Bildergalerie auf den Restaurantseiten'
          reason: 'Die Galerie lässt sich mit der Tastatur öffnen und mit Escape schließen; die Rückgabe des Fokus an das auslösende Bild ist noch nicht abschließend bestätigt.'
          planned: 'nächste Prüfrunde'
        - criterion: 'Küchen-Auswahlfeld (Mehrfachauswahl)'
          reason: 'Vorschläge und die getroffene Auswahl werden Screenreadern angesagt; das Entfernen eines bereits gewählten Eintrags wird noch nicht verbal gemeldet.'
          planned: 'nächste Prüfrunde'
        - criterion: 'Abschließende Screenreader-Prüfung'
          reason: 'Die automatisierte Prüfung (axe-core, WCAG 2.2 AA) ist bestanden; eine vollständige Abnahme mit echtem Screenreader steht noch aus.'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            bool $debug: '%kernel.debug%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
