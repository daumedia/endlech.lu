# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# Root-Redirect: / → /{locale}/
app_root:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: app_home
        _locale: lb
        permanent: false

# Locale-freier Kurzlink auf die Transparenzseite.
# /open ist die URL, die in Fördermails, auf Visitenkarten und in Vorträgen
# steht – sie darf nicht an einer Sprachwahl scheitern.
app_open_redirect:
    path: /open
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: app_open
        _locale: lb
        permanent: false

# Locale-freier Kurzlink auf die Vergleichsübersicht (Feature 03).
# Dieselbe Begründung wie bei /open: Die kurze Adresse steht in Mails und
# Vorträgen und darf nicht an einer Sprachwahl scheitern. Gilt nur für die
# Übersicht — die Einzelseiten tragen ihren Slug ohnehin und werden verlinkt,
# nicht abgetippt.
app_comparison_redirect:
    path: /vergleich
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: app_comparison_index
        _locale: lb
        permanent: false

# Locale-freier Kurzlink auf die Presseseite (Feature 05).
# Dieselbe Begründung wie bei /open und /vergleich: Die kurze Adresse steht in
# Mails an Redaktionen und auf Visitenkarten und darf nicht an einer Sprachwahl
# scheitern.
#
# ⚠ **Der optionale Schrägstrich ist die Reparatur von BF-100, keine Kosmetik.**
# Solange `public/presse/` existierte, schickte Apaches `mod_dir` jeden Aufruf
# von /presse **dauerhaft (301)** auf /presse/, und Symfonys Trailing-Slash-Regel
# schickte zurück — eine endlose Schleife auf Produktion, lokal unsichtbar. Das
# Verzeichnis heißt seither `presse-kit`; der 301er steht aber weiter in den
# Browsern derer, die die kaputte Adresse geöffnet haben.
#
# Deshalb matcht **eine** Route beide Formen exakt: Weder /presse noch /presse/
# löst noch eine Trailing-Slash-Weiterleitung aus, beide gehen direkt auf die
# Sprachfassung. Zwei getrennte Routen genügen nicht — die zuerst definierte
# zieht ihre Slash-Regel, bevor die zweite geprüft wird; gemessen am 2026-08-30.
# `ignoreAttributes` hält den Hilfsparameter aus der Zieladresse heraus.
app_press_redirect:
    path: /presse{trailing_slash}
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: app_press_index
        _locale: lb
        permanent: false
        trailing_slash: ''
        ignoreAttributes: ['trailing_slash']
    requirements:
        trailing_slash: '/?'

# Locale-freie Kurzlinks auf Roadmap und Changelog (Feature 07).
# Dieselbe Begründung wie bei /open, /vergleich und /presse: kurze Adressen, die
# in Mails und Vorträgen stehen, dürfen nicht an einer Sprachwahl scheitern.
#
# ⚠ **Nicht permanent.** Ein 301 bliebe in fremden Browsern stehen — das war der
# teure Teil von BF-100, nicht die Schleife selbst.
#
# ⚠ **Es darf kein Verzeichnis `public/roadmap` und kein `public/changelog`
# entstehen.** Apaches mod_dir schickte sonst /roadmap per 301 auf /roadmap/,
# während Symfony zurückschickt — lokal unsichtbar, weil der Entwicklungsserver
# kein mod_dir hat. RouteDirectoryCollisionTest prüft genau diese Ursache.
app_roadmap_redirect:
    path: /roadmap
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: app_roadmap_index
        _locale: lb
        permanent: false

app_changelog_redirect:
    path: /changelog
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: app_changelog_index
        _locale: lb
        permanent: false

# Alle Controller mit /{_locale} Prefix (inkl. Admin)
# Ausnahmen: Api/V1 und Controller/Open werden separat ohne Locale-Prefix
# importiert.
controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
        exclude:
            - '../src/Controller/Api/V1/'
            - '../src/Controller/Open/'
            - '../src/Controller/Marketing/'
    type: attribute
    prefix: /{_locale}
    requirements:
        _locale: lb|de|fr|en
    defaults:
        _locale: lb

# REST-API für die iOS-App – versioniert, locale-frei (Issue #87)
api_v1:
    resource:
        path: ../src/Controller/Api/V1/
        namespace: App\Controller\Api\V1
    type: attribute
    prefix: /api/v1

# Maschinenlesbare Open-Startup-Daten – sprachfrei, damit zitierte URLs
# eindeutig bleiben (/open.json, /open/dataset.csv, /open/dataset.json).
open_data:
    resource:
        path: ../src/Controller/Open/
        namespace: App\Controller\Open
    type: attribute

# Brevo-Webhook (Feature 04) – sprachfrei, weil Brevo ohne Sprachpräfix ruft.
# Ein Locale-Prefix machte die eine URL, die in Brevos Konfiguration steht,
# von einer Sprachwahl abhängig. Die zugehörige access_control-Zeile steht in
# security.yaml VOR den Web-Regeln (BF-18).
marketing_webhook:
    resource:
        path: ../src/Controller/Marketing/
        namespace: App\Controller\Marketing
    type: attribute
