twig:
    file_name_pattern: '*.twig'
    globals:
        app_version: '%app.version%'
        # Feature 05: dieselben Werte auf /presse und /legal. Als Globals und nicht
        # über die Controller, weil zwei Controller sie brauchen und der dritte, der
        # sie vergisst, eine Seite mit halben Betreiberangaben ausliefern würde.
        operator_name: '%app.operator_name%'
        operator_address: '%app.operator_address%'
        operator_responsible: '%app.operator_responsible%'
        # Seit der Eintragung der S.à r.l.-S (2026-09-05). Art. 5 der Loi du
        # 14 août 2000 verlangt Handelsregisternummer, Ermächtigung und — falls
        # vorhanden — die MwSt-Nummer (seit 2026-11-05 eingetragen; leer gesetzt
        # blendet das Template die Zeile von selbst aus).
        operator_legal_form: '%app.operator_legal_form%'
        operator_rcs: '%app.operator_rcs%'
        operator_authorisation: '%app.operator_authorisation%'
        operator_vat: '%app.operator_vat%'
        # Herstellerhinweis in der Fußzeile (jede Seite, deshalb Global).
        operator_brand: '%app.operator_brand%'
        operator_website: '%app.operator_website%'
        press_email: '%app.press_email%'

when@test:
    twig:
        strict_variables: true
