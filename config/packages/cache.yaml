framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Kennzahlen der Open-Startup-Seite (/open).
            #
            # Ein eigener Pool statt cache.app, damit der Admin nach einer
            # Änderung an den Finanzdaten gefahrlos clear() aufrufen kann –
            # ein clear() auf cache.app würde den halben Anwendungscache
            # mitnehmen.
            cache.open_stats:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600

            # Community-Ideen der öffentlichen Roadmap (/roadmap, Feature 07).
            #
            # Eigener Pool statt cache.open_stats: Beide werfen ihren Inhalt
            # vollständig weg. Eine Finanzänderung im Admin nähme sonst die
            # Roadmap mit, eine Zustimmung im Board die Kennzahlen.
            #
            # ⚠ Die Lebensdauer ist NICHT der Hauptweg (OF-07, entschieden am
            # 2026-08-30). Verworfen wird der Pool von RoadmapCacheListener,
            # sobald sich eine Idee, eine Stimme oder ein Konto ändert; die
            # Stunde ist das Netz für Wege, die niemand vorhergesehen hat —
            # etwa die Fremdschlüssel-Kaskade, die Stimmen in der Datenbank
            # entfernt, am Anwendungscode vorbei.
            cache.roadmap:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600

when@test:
    framework:
        cache:
            pools:
                # In Tests darf kein Ergebnis über Kernel-Neustarts hinweg
                # überleben: Ein Test, der Restaurants anlegt und danach /open
                # aufruft, sähe sonst den Stand eines früheren Tests.
                cache.open_stats:
                    adapter: cache.adapter.array
                    default_lifetime: 3600

                # Gleiche Begründung wie oben: Ein Test, der eine Idee auf
                # „Geplant" setzt und danach /roadmap aufruft, sähe sonst den
                # Stand eines früheren Tests.
                cache.roadmap:
                    adapter: cache.adapter.array
                    default_lifetime: 3600
