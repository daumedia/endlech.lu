framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Merkposten der Zeitpläne (App\Scheduler\*). Symfony hält hier je
            # Zeitplan fest, bis wann er abgearbeitet ist — daraus errechnet er
            # nach einem Ausfall, welche Läufe fehlen.
            #
            # ⚠ **Datenbank, nicht Dateisystem — und das ist der ganze Zweck.**
            # Alle anderen Pools hier liegen unter var/cache; das ist für sie
            # richtig, weil ihr Inhalt jederzeit neu berechnet werden kann. Der
            # Merkposten kann das nicht: Er IST die Information. `cache:clear`
            # läuft bei jedem Deploy, und ein leerer Merkposten bedeutet „letzter
            # Lauf: jetzt" — ein Monatslauf, der während des Deploys fällig war,
            # wäre damit endgültig weg, ohne Fehlermeldung.
            #
            # Die Tabelle `cache_items` legt `Version20260902200000` an.
            #
            # ⚠ Sie hat ZWEI mögliche Erzeuger: die Migration und dieser Adapter,
            # der sie beim ersten Schreibzugriff selbst anlegt, wenn sie fehlt.
            # Läuft der Worker vor der Migration — beim Umzug auf ein neues
            # Hosting der Normalfall, weil der Consumer sofort seinen Merkposten
            # schreibt —, existiert die Tabelle danach ohne Eintrag in
            # `doctrine_migration_versions`, und die Migration scheitert bei JEDEM
            # Deploy an „Table 'cache_items' already exists". Genau deshalb trägt
            # sie `CREATE TABLE IF NOT EXISTS` (gemessen am 2026-09-02).
            cache.scheduler:
                adapter: cache.adapter.doctrine_dbal
                provider: 'doctrine.dbal.default_connection'
                # Kein default_lifetime: Der Merkposten darf nicht ablaufen.
                # Symfony setzt selbst eine Frist von fünf Jahren
                # (Checkpoint::CACHE_EXPIRY).

            # Kennzahlen der Open-Startup-Seite (/open).
            #
            # Ein eigener Pool statt cache.app, damit der Admin nach einer
            # Änderung an den Finanzdaten gefahrlos clear() aufrufen kann –
            # ein clear() auf cache.app würde den halben Anwendungscache
            # mitnehmen.
            cache.open_stats:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600

            # Community-Ideen der öffentlichen Roadmap (/roadmap, Feature 07).
            #
            # Eigener Pool statt cache.open_stats: Beide werfen ihren Inhalt
            # vollständig weg. Eine Finanzänderung im Admin nähme sonst die
            # Roadmap mit, eine Zustimmung im Board die Kennzahlen.
            #
            # ⚠ Die Lebensdauer ist NICHT der Hauptweg (OF-07, entschieden am
            # 2026-08-30). Verworfen wird der Pool von RoadmapCacheListener,
            # sobald sich eine Idee, eine Stimme oder ein Konto ändert; die
            # Stunde ist das Netz für Wege, die niemand vorhergesehen hat —
            # etwa die Fremdschlüssel-Kaskade, die Stimmen in der Datenbank
            # entfernt, am Anwendungscode vorbei.
            cache.roadmap:
                adapter: cache.adapter.filesystem
                default_lifetime: 3600

            # Die fertig erzeugte Sitemap (/sitemap.xml, Feature 10).
            #
            # ⚠ **50 Minuten, nicht 60 — und das ist Rechnung, keine Vorliebe.** Die
            # Antwort trägt zusätzlich `Cache-Control: max-age=600`. Beide Speicher
            # addieren sich: Wird eine Fassung kurz vor ihrem Ablauf ausgeliefert, liegt
            # sie danach noch zehn Minuten bei einem Zwischenhändler. 3000 + 600 = 3600 s
            # hält die Zusage aus AK-08/AK-09 („binnen 60 Minuten") auch dann ein; mit
            # zweimal 3600 wären es bis zu zwei Stunden. SitemapControllerTest prüft die
            # Summe — wer eine der beiden Zahlen ändert, bekommt dort einen roten Lauf.
            #
            # Kein Verwerfen bei Änderungen: Die Spec verlangt 60 Minuten, nicht sofort.
            cache.sitemap:
                adapter: cache.adapter.filesystem
                default_lifetime: 3000

when@test:
    framework:
        cache:
            pools:
                # Im Test kein Datenbank-Pool: Die Schreibvorgänge lägen in der
                # Transaktion, die dama/doctrine-test-bundle nach jedem Test
                # zurückrollt — der Merkposten wäre also ohnehin nicht haltbar,
                # und die Tabelle müsste in der Test-DB stehen.
                # ⚠ `provider: ~` ist Pflicht, nicht Zierde. Die Pool-Definition
                # wird mit dem Block oben verschmolzen; ohne diese Zeile bliebe
                # dort `provider: doctrine.dbal.default_connection` stehen und
                # landete als erstes Konstruktor-Argument im ArrayAdapter:
                # „ArrayAdapter::__construct(): Argument #1 ($defaultLifetime)
                # must be of type int, Doctrine\DBAL\Connection given" — und zwar
                # als 500er in 456 Prüfläufen auf einmal.
                cache.scheduler:
                    adapter: cache.adapter.array
                    provider: ~

                # In Tests darf kein Ergebnis über Kernel-Neustarts hinweg
                # überleben: Ein Test, der Restaurants anlegt und danach /open
                # aufruft, sähe sonst den Stand eines früheren Tests.
                cache.open_stats:
                    adapter: cache.adapter.array
                    default_lifetime: 3600

                # Gleiche Begründung wie oben: Ein Test, der eine Idee auf
                # „Geplant" setzt und danach /roadmap aufruft, sähe sonst den
                # Stand eines früheren Tests.
                cache.roadmap:
                    adapter: cache.adapter.array
                    default_lifetime: 3600

                # Gleiche Begründung: Ein Test, der Restaurants löscht und danach die
                # Sitemap abruft, sähe sonst die Fassung eines früheren Tests.
                cache.sitemap:
                    adapter: cache.adapter.array
                    default_lifetime: 3000
