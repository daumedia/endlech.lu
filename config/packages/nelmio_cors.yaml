nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: []
        allow_methods: []
        allow_headers: []
        max_age: 0
    paths:
        # CORS gilt nur für die /api/v1-Endpunkte (native iOS sendet keinen Origin;
        # primär für künftiges Web-Frontend / WebView relevant).
        '^/api/v1/':
            origin_regex: true
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_methods: ['GET', 'OPTIONS', 'POST']
            allow_headers: ['Content-Type', 'Authorization']
            max_age: 3600
