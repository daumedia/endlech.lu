security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api_login:
            pattern: ^/api/v1/auth/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: api_v1_auth_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api/v1
            stateless: true
            provider: app_user_provider
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week
            logout:
                path: app_logout
                target: app_home

    access_control:
        # API (/api/v1) – locale-frei, reihenfolgeabhängig: spezifisch vor allgemein.
        - { path: '^/api/v1/auth', roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/restaurants', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/me', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/api/v1/restaurants', methods: [POST], roles: IS_AUTHENTICATED_FULLY }
        # Web
        - { path: '^/[a-z]{2}/admin', roles: ROLE_ADMIN }
        - { path: '^/[a-z]{2}/profile', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/[a-z]{2}/register', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/login', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/verify', roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
