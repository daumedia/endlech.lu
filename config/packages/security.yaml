security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api_login:
            pattern: ^/api/v1/auth/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: api_v1_auth_login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api/v1
            stateless: true
            provider: app_user_provider
            jwt: ~
        main:
            lazy: true
            provider: app_user_provider
            # Passkey-Anmeldung. Läuft über denselben check_path wie form_login;
            # welcher der beiden greift, entscheidet allein das Feld _assertion
            # (siehe App\Security\PasskeyAuthenticator::supports()).
            custom_authenticator: App\Security\PasskeyAuthenticator
            # Pflicht, sobald eine Firewall mehr als einen Authenticator führt:
            # Symfony muss wissen, wer den Weg zur Anmeldung weist, wenn ein
            # Gast eine geschützte Seite aufruft. Das ist form_login – es kennt
            # den login_path. Der Passkey-Authenticator kann nichts anbieten,
            # solange kein Formular abgeschickt wurde.
            entry_point: form_login
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_home
                enable_csrf: true
            # Ohne diese drei Zeilen nimmt die Anmeldung beliebig viele Fehlversuche
            # entgegen – nachgestellt mit 20 Versuchen gegen das Admin-Konto, alle
            # angenommen. Ausgerechnet die API war längst gedrosselt (api_login,
            # 5/Minute): geschützt war der Weg, den eine App nimmt, nicht der, den ein
            # Browser nimmt. Dahinter steht ein Verwaltungszugang an genau einem Konto,
            # ohne zweite Stufe.
            login_throttling:
                max_attempts: 5          # je Kombination aus IP und Benutzername
                interval: '15 minutes'
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 1 week
            logout:
                path: app_logout
                target: app_home
                # Ohne das genügte ein <img src="/de/logout"> auf einer fremden Seite,
                # um einen angemeldeten Besucher abzumelden. Der Schaden ist gering,
                # aber es ist kein Schutz. Verlangt einen POST mit Token – der
                # Abmeldelink in base.html.twig ist deshalb ein Formular.
                enable_csrf: true

    access_control:
        # API (/api/v1) – locale-frei, reihenfolgeabhängig: spezifisch vor allgemein.
        - { path: '^/api/v1/auth', roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/restaurants', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: '^/api/v1/me', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/api/v1/restaurants', methods: [POST], roles: IS_AUTHENTICATED_FULLY }
        # Passkey-Endpunkte – locale-frei, deshalb vor den Web-Regeln.
        - { path: '^/passkey/login/options', roles: PUBLIC_ACCESS }
        - { path: '^/passkey/register', roles: IS_AUTHENTICATED_FULLY }
        # Web
        - { path: '^/[a-z]{2}/admin', roles: ROLE_ADMIN }
        - { path: '^/[a-z]{2}/profile', roles: IS_AUTHENTICATED_FULLY }
        - { path: '^/[a-z]{2}/register', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/login', roles: PUBLIC_ACCESS }
        - { path: '^/[a-z]{2}/verify', roles: PUBLIC_ACCESS }

when@test:
    security:
        # Ohne diesen Wert scheitert jeder Test, der mehr als fünf Anmeldungen
        # durchspielt – dieselbe Vorsichtsmaßnahme wie bei den Limitern in
        # framework.yaml.
        firewalls:
            main:
                login_throttling:
                    max_attempts: 10000
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
