name: CD

# Ein Merge nach master ist der Deploy. Der Runner hält keinen Code vor –
# er öffnet eine SSH-Sitzung und lässt den Server sich selbst aktualisieren
# (siehe .github/deploy.sh).
on:
  push:
    branches: [master]
  workflow_dispatch:

# Zwei parallele Deploys würden sich den Arbeitsbaum umschreiben.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-assets:
    name: Asset-Konsistenz
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # PFLICHT vor npm: node_modules/@symfony/ux-turbo ist ein Symlink nach
      # vendor/symfony/ux-turbo/assets (package.json: "file:"-Dependency).
      # Ohne vendor/ scheitert der Webpack-Build am toten Link.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        # --no-scripts: die auto-scripts (cache:clear) bräuchten ein DATABASE_URL,
        # das nur in der gitignorierten .env.local liegt. Für den Build irrelevant.
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # .nvmrc statt fester Version: der committete public/build stammt aus
          # der lokalen Node-Version. Weicht der Runner ab, könnte der Vergleich
          # unten grundlos rot werden.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Vergleich mit committetem Build
        # git status --porcelain statt git diff --exit-code: bei aktivem
        # cleanupOutputBeforeBuild() erscheint ein geänderter Hash als
        # *untracked* Datei – und die meldet git diff nie.
        run: |
          if [ -n "$(git status --porcelain public/build)" ]; then
            git status --short public/build
            echo "::error::public/build passt nicht zu assets/ – lokal 'npm run build' ausführen und mitcommitten"
            exit 1
          fi
          echo "public/build ist auf dem Stand von assets/"

  deploy:
    name: Deploy nach Production
    needs: verify-assets
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Holt eine einzige Datei statt des ganzen Repos – der Runner braucht
      # den Code nie, er redet nur über SSH.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/deploy.sh
          sparse-checkout-cone-mode: false

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "${{ secrets.APP_USER }}@${{ secrets.APP_HOST }}" \
            'bash -s' < .github/deploy.sh
