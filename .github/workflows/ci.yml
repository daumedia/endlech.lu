name: CI

# Automatische Trigger (push/PR) abgeschaltet – CI läuft nur noch manuell
# über "Run workflow" (GitHub-UI) bzw. `gh workflow run ci.yml`.
on:
  workflow_dispatch:

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # zip: PressPackageTest (Feature 05) öffnet die committete Paketdatei.
          # Ohne die Erweiterung bricht der Lauf mit einer Meldung über eine
          # unbekannte Klasse ab — das sieht wie ein Codefehler aus und ist keiner.
          extensions: ctype, iconv, intl, mbstring, pdo_mysql, gd, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        # --no-scripts: Auto-Scripts (cache:clear/assets) brauchen ein dev-DATABASE_URL,
        # das nur in der gitignorierten .env.local liegt. Für Tests irrelevant – die
        # --env=test-Befehle bauen den Test-Cache selbst (DATABASE_URL aus .env.test).
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Generate JWT keypair
        run: php bin/console lexik:jwt:generate-keypair --env=test --skip-if-exists

      - name: Build assets (AssetMapper)
        # ⚠ Pflicht vor PHPUnit: Jede Seite rendert `importmap()`, und das braucht die von
        # SWC kompilierten Module unter var/typescript/ — ohne sie scheitert jeder
        # Funktionstest mit einer Seite. assets/vendor/ ist gitignored (importmap:install
        # holt es), BuiltAssetsTest liest var/tailwind/app.built.css.
        run: |
          php bin/console importmap:install --env=test
          php bin/console tailwind:build --env=test
          php bin/console typescript:build --env=test

      - name: Prepare test database
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction
          php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Run PHPUnit
        run: php bin/phpunit

  frontend:
    name: TypeScript & ESLint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ⚠ Die Typen von `@symfony/stimulus-bundle` liegen im Composer-Paket, nicht auf npm
      # (tsconfig.json: `paths` → vendor/symfony/stimulus-bundle/assets/dist/loader.d.ts).
      # Ohne vendor/ meldet `tsc` das Modul als unbekannt.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, mbstring
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies (nur für Typen)
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts --no-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Gemeinsame Quelle mit der lokalen Entwicklung. Node baut nichts mehr
          # (seit 2026-10-22 AssetMapper), es prüft nur Typen und Stil.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint
