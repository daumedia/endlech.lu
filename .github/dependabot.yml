# Dependabot für das monatliche Wartungsfenster (erster Samstag im Monat).
# Sicherheitsupdates kommen sofort, unabhängig vom Zeitplan (Repo-Einstellung).
# Versions-Updates kommen am 1. des Monats, gebündelt je Paketverwaltung.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Luxembourg
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    # Symfony-Minor- und -Major-Versionen bewusst von Hand (extra.symfony.require).
    # Sicherheitskorrekturen kommen bei Symfony als Patch und bleiben erlaubt.
    ignore:
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      composer-sicherheit:
        applies-to: security-updates
        patterns: ["*"]
      composer-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Luxembourg
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    groups:
      npm-sicherheit:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Luxembourg
    groups:
      github-actions:
        patterns: ["*"]
