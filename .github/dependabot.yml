# Dependabot für das monatliche Wartungsfenster (erster Samstag im Monat).
# Sicherheitsupdates kommen sofort, unabhängig vom Zeitplan (Repo-Einstellung).
# Versions-Updates kommen am 1. des Monats, gebündelt je Paketverwaltung.
# Ausnahme Composer: nur Sicherheits-PRs, siehe unten.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Luxembourg
    # Keine monatlichen Composer-PRs: Dependabot beachtet extra.symfony.require
    # nicht und mischt Symfony-Versionen. Composer-Updates laufen von Hand mit
    # Flex (composer update) im Wartungsfenster. Sicherheits-PRs kommen weiter.
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      composer-sicherheit:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Luxembourg
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    groups:
      npm-sicherheit:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Europe/Luxembourg
    groups:
      github-actions:
        patterns: ["*"]
